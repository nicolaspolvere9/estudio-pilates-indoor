/* El ciclo se vuelve a contar cada vez que la alumna paga: el próximo
   vencimiento cae cuando se le terminan las clases contadas desde el día que
   pagó, y no sobre una grilla fija arrancada meses atrás. Si paga justo el día
   que le vencía —lo normal— esto no cambia nada. Si paga antes o después, corre
   el vencimiento siguiente para que siempre sean sus clases contadas desde el
   pago. (El recargo por atraso no lo toca: ese se calcula aparte, sobre la
   fecha en que le vencía.) */
function reanclarCiclo(c,fecha){
  if(c.tipo==='suelta') return;
  const al=state.alumnos.find(a=>a.id===c.alumnoId);
  if(!al) return;
  // Si todavía arrastra un ciclo más viejo sin pagar, primero tiene que
  // ponerse al día: recién ahí tiene sentido reacomodar el calendario.
  if(state.cargos.some(x=>x.alumnoId===c.alumnoId&&x.id!==c.id&&!x.pagado&&
     x.tipo!=='suelta'&&x.desde<c.desde)) return;

  const conCicloEmpezado=diff(c.desde,fecha)>0;
  // Pagó con el ciclo ya empezado: ese ciclo se cierra el día anterior y el
  // nuevo arranca el día del pago. Pagó el ciclo entero por adelantado: ya
  // estaba bien contado, y el siguiente vence cuando se le terminan las clases
  // que acaba de pagar.
  const arranca=conCicloEmpezado?fecha:addDays(c.hasta,1);
  if(conCicloEmpezado) c.hasta=addDays(fecha,-1);
  const hasta=finDeCiclo(arranca,al);
  const vence=conCicloEmpezado?vencimientoDeCiclo(arranca,hasta,al):c.vence;

  const sig=state.cargos.filter(x=>x.alumnoId===al.id&&!x.pagado&&x.tipo!=='suelta')
    .sort((a,b)=>a.desde.localeCompare(b.desde))[0];
  if(sig){ sig.desde=arranca; sig.hasta=hasta; sig.vence=vence; }
  else{
    const pr=precioDe(al);
    state.cargos.push({id:uid(),alumnoId:al.id,tipo:'ciclo',desde:arranca,hasta,vence,
      monto:pr.monto,detalle:pr.detalle,reparto:repartoDe(al),pagado:false,venceV2:true});
  }
}
/* Corrige a mano cuándo tiene que pagar un ciclo pendiente. Hace falta porque
   el vencimiento se calcula contando las clases del ciclo desde que la alumna
   arrancó, y eso se desalinea de la realidad cuando paga antes o después de lo
   previsto: ahí el que sabe la fecha correcta es el estudio, no la cuenta.
   El ciclo se cierra el día anterior a la nueva fecha, así el siguiente arranca
   justo ese día y todos los vencimientos que siguen se acomodan solos. */
function modalFechaPago(cargoId){
  if(!puede('pagos_editar')) return;
  const c=state.cargos.find(x=>x.id===cargoId);
  if(!c) return;
  const a=state.alumnos.find(x=>x.id===c.alumnoId);
  document.getElementById('modalRoot').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)cerrar()"><div class="modal">
    <h2 style="margin-bottom:6px;">¿Cuándo tiene que pagar ${a?esc(a.nombre):'—'}?</h2>
    <div class="note" style="margin-bottom:12px;">Esto <b>no registra un pago</b>: cambia la fecha en la
      que le toca pagar el ciclo que tiene pendiente (del ${fmt(c.desde)} al ${fmt(c.hasta)}, hoy figura
      el <b>${fmt(c.vence)}</b>). Si ya te pagó, cerrá esto y usá "Registrar pago".</div>
    <label style="margin-top:0;">¿Qué día tiene que pagar?</label>
    <input type="date" id="fp_fecha" value="${c.vence}">
    <button class="btn block" style="margin-top:16px;" onclick="guardarFechaPago('${cargoId}')">Guardar</button>
    <button class="btn ghost block" style="margin-top:9px;" onclick="cerrar()">Cancelar</button>
  </div></div>`;
}
function guardarFechaPago(cargoId){
  if(!puede('pagos_editar')) return;
  if(bloqueado('fecha-pago')) return;
  try{
    const c=state.cargos.find(x=>x.id===cargoId);
    if(!c) return;
    const f=document.getElementById('fp_fecha').value;
    if(!f) return showToast('Elegí una fecha.');
    if(diff(c.desde,f)<=0) return showToast(`Ese ciclo arranca el ${fmt(c.desde)}, así que no puede vencer antes. Si lo que querés es anotar un pago que ya te hizo, usá "Registrar pago".`);
    c.vence=f; c.hasta=addDays(f,-1);
    save('cargos');
    generarCargosPendientes();
    cerrar(); pintarVista(); showToast('Fecha de pago actualizada.');
  } finally { desbloquear('fecha-pago'); }
}

function anularPago(id){
  if(bloqueado('anular-pago-'+id)) return;
  try{
    const p=state.pagos.find(x=>x.id===id);

    const c=state.cargos.find(x=>x.id===p.cargoId);
    if(c){ c.pagado=false; delete c.fechaPago; delete c.recargoPagado; }
    state.pagos=state.pagos.filter(x=>x.id!==id);
    save('pagos'); save('cargos'); cerrar(); pintarVista(); showToast('Pago anulado.');

/* ═════════ FINANZAS ═════════ */
function rangoBalance(){
  if(balModo==='semana'){
    const l=addDays(lunesDe(todayStr()),balOffset*7);
    return {desde:l,hasta:addDays(l,6),label:`${fmtCorto(l)} – ${fmtCorto(addDays(l,6))}`};
  }
  const hoy=new Date(todayStr()+'T12:00:00');
  const d=new Date(hoy.getFullYear(),hoy.getMonth()+balOffset,1);
  const desde=d.toISOString().slice(0,10);
  const fin=new Date(d.getFullYear(),d.getMonth()+1,0);
  const hasta=fin.toISOString().slice(0,10);
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return {desde,hasta,label:`${meses[d.getMonth()]} ${d.getFullYear()}`};
}
function vFinanzas(){
  const r=rangoBalance();
  const pagosR=state.pagos.filter(p=>p.fecha>=r.desde&&p.fecha<=r.hasta);
  const gastosR=state.gastos.filter(g=>g.fecha>=r.desde&&g.fecha<=r.hasta);
  const ing=pagosR.reduce((s,p)=>s+Number(p.monto),0);
  const eg=gastosR.reduce((s,g)=>s+Number(g.monto),0);
  const neto=ing-eg;
  const porCat={};
  gastosR.forEach(g=>{ porCat[g.categoria]=(porCat[g.categoria]||0)+Number(g.monto); });
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=cats.length?cats[0][1]:1;

  // Rentabilidad por disciplina
  const ingD={pilates:0,indoor:0};
  pagosR.forEach(p=>{ const r=repartoPago(p); ingD.pilates+=r.pilates; ingD.indoor+=r.indoor; });
  const gasD={pilates:0,indoor:0}; let compartido=0;
  gastosR.forEach(g=>{
    const d=g.disciplina||'compartido';
    if(d==='pilates'||d==='indoor') gasD[d]+=Number(g.monto); else compartido+=Number(g.monto);
  });
  const baseRep=ingD.pilates+ingD.indoor;
  const repP = baseRep? Math.round(compartido*ingD.pilates/baseRep) : Math.round(compartido/2);
  const repI = compartido-repP;
  const totP=gasD.pilates+repP, totI=gasD.indoor+repI;
  const resP=ingD.pilates-totP, resI=ingD.indoor-totI;

  let h=`<div class="seg">
    <button class="${balModo==='semana'?'active':''}" onclick="setBal('semana')">Semanal</button>
    <button class="${balModo==='mes'?'active':''}" onclick="setBal('mes')">Mensual</button></div>
  <div class="week-bar">
    <button class="mini-btn" onclick="movBal(-1)">←</button>
    <span class="lbl">${r.label}</span>
    <button class="mini-btn" onclick="movBal(1)">→</button></div>

  <div class="grid-stats">
    <div class="stat"><div class="num mono" style="color:var(--fijo-ink)">${money(ing)}</div><div class="label">Ingresos</div></div>
    <div class="stat"><div class="num mono" style="color:var(--danger)">${money(eg)}</div><div class="label">Gastos</div></div>
    <div class="stat"><div class="num mono" style="color:${neto>=0?'var(--fijo-ink)':'var(--danger)'}">${money(neto)}</div><div class="label">Resultado</div></div>
  </div>`;

  h+=`<div class="card"><h3>Rentabilidad por disciplina</h3>
    <div class="note" style="margin:8px 0 4px;">${compartido
      ? `De ${money(compartido)} en gastos compartidos se asignó ${money(repP)} a Pilates y ${money(repI)} a Indoor, según lo facturado por cada una.`
      : 'Sin gastos compartidos en este período.'}</div>
    <div class="field-row" style="margin-top:10px;">
      ${[['Pilates',ingD.pilates,gasD.pilates,repP,totP,resP,'var(--fijo-ink)'],
         ['Indoor', ingD.indoor, gasD.indoor, repI,totI,resI,'var(--unico-ink)']].map(
        ([n,ing2,dir,rep,tot,res,col])=>`
        <div class="card flat" style="margin:0;padding:12px;">
          <div style="font-weight:700;font-size:13.5px;color:${col};margin-bottom:8px;">${n}</div>
          <div class="hist-row"><span>Ingresos</span><span class="mono">${money(ing2)}</span></div>
          <div class="hist-row"><span>Gastos propios</span><span class="mono">${money(dir)}</span></div>
          <div class="hist-row"><span>Parte compartida</span><span class="mono">${money(rep)}</span></div>
          <div class="hist-row" style="border-top:1px solid var(--line);border-bottom:none;">
            <span style="font-weight:700;">Resultado</span>
            <span class="mono" style="font-weight:700;color:${res>=0?'var(--fijo-ink)':'var(--danger)'};">${money(res)}</span></div>
        </div>`).join('')}
    </div></div>`;

  if(cats.length){
    h+=`<div class="card"><h3>Gastos por rubro</h3>`;
    cats.forEach(([c,v])=>{
      h+=`<div class="bar-row"><div class="top"><span>${esc(c)}</span>
        <span class="mono" style="font-weight:600;">${money(v)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxCat*100)}%;background:var(--unico-ink);"></div></div></div>`;
    });
    h+=`</div>`;
  }

  h+=`<div class="fab-row"><button class="btn" onclick="modalGasto()">+ Registrar gasto</button></div>`;
  h+=`<h3 style="margin-bottom:8px;">Gastos del período</h3>`;
  if(!gastosR.length) h+=`<div class="empty">Sin gastos registrados en este período.</div>`;
  else{
    h+=`<div class="card">`;
    gastosR.sort((a,b)=>b.fecha.localeCompare(a.fecha)).forEach(g=>{
      h+=`<div class="list-item" onclick="modalGasto('${g.id}')">
        <div style="min-width:0;"><div class="name">${esc(g.detalle||g.categoria)}</div>
        <div class="meta">${fmt(g.fecha)} · ${esc(g.categoria)} · ${
          (g.disciplina||'compartido')==='pilates'?'Pilates':(g.disciplina==='indoor'?'Indoor':'Compartido')
        }${g.proveedor?' · '+esc(g.proveedor):''}</div></div>
        <div class="mono" style="font-weight:700;color:var(--danger);">−${money(g.monto).slice(1)}</div></div>`;
    });
    h+=`</div>`;
  }
  h+=`<h3 style="margin:17px 0 8px;">Ingresos del período</h3>`;
  if(!pagosR.length) h+=`<div class="empty">Sin cobros en este período.</div>`;
  else{
    h+=`<div class="card">`;
    pagosR.sort((a,b)=>b.fecha.localeCompare(a.fecha)).forEach(p=>{
      const a=state.alumnos.find(x=>x.id===p.alumnoId);
      h+=`<div class="list-item" style="cursor:default;">
        <div><div class="name">${a?esc(a.nombre):'—'}</div><div class="meta">${fmt(p.fecha)}</div></div>
        <div class="mono" style="font-weight:700;color:var(--fijo-ink);">${money(p.monto)}</div></div>`;
    });
    h+=`</div>`;
  }
  return h;
}

async function guardarUsuario(id){
  if(bloqueado('crear-usuario')) return;
  try{
    const u=id?state.usuarios.find(x=>x.id===id):null;
    const nom=document.getElementById('u_nom').value.trim();
    const mail=(u&&u.rol==='dueño')?u.email:document.getElementById('u_mail').value.trim().toLowerCase();
    const pass=document.getElementById('u_pass').value;
    if(!nom) return showToast('Falta el nombre.');
    if(!emailOk(mail)) return showToast('Email inválido.');
    if(state.usuarios.some(x=>x.email===mail&&x.id!==id)) return showToast('Ya existe un usuario con ese email.');
    if(!u||pass){
      const err=validarPass(pass); if(err) return showToast(err);
    }
    const permisos={};
    if(!u||u.rol!=='dueño') PERMISOS.forEach(p=>{
      const el=document.getElementById('pm_'+p.k); permisos[p.k]=el?el.checked:false; });

    if(u){
      if(pass){
        const {data,error}=await sb.functions.invoke('crear-usuario',{body:{accion:'resetear_pass',usuarioId:u.id,password:pass}});
        if(error) return showToast('Error de conexión.');
        if(data&&data.error) return showToast(data.error);
      }
      const cambios={nombre:nom}; if(u.rol!=='dueño') cambios.permisos=permisos;
      const {error:errUp}=await sb.from('perfiles').update(cambios).eq('id',u.id);
      if(errUp) return showToast('No se pudo guardar: '+errUp.message);
      u.nombre=nom; if(u.rol!=='dueño'){ u.email=mail; u.permisos=permisos; }
    } else {
      const {data,error}=await sb.functions.invoke('crear-usuario',{body:{accion:'crear',nombre:nom,email:mail,password:pass,permisos}});
      if(error) return showToast('Error de conexión.');
      if(data&&data.error) return showToast(data.error);
      state.usuarios.push({id:data.id,nombre:nom,email:mail,rol:'empleado',permisos,activo:true,creado:todayStr()});
    }
    cerrar(); pintarVista(); showToast('Usuario guardado.');
  } finally { desbloquear('crear-usuario'); }
}
async function toggleUsuario(id){
  const u=state.usuarios.find(x=>x.id===id);
  const nuevoActivo=!u.activo;
  const {error}=await sb.from('perfiles').update({activo:nuevoActivo}).eq('id',id);
  if(error) return showToast('No se pudo actualizar.');
  u.activo=nuevoActivo; cerrar(); pintarVista();
  showToast(u.activo?'Acceso reactivado.':'Acceso desactivado.');
}

    <div class="note ${dSin===null||dSin>14?'aviso':''}" style="margin:8px 0 12px;">
      ${state.config.ultimoBackup
        ? `Última copia: <b>${fmt(state.config.ultimoBackup)}</b>${dSin>14?` — hace ${dSin} días. Conviene bajar una nueva.`:` (hace ${dSin} día${dSin===1?'':'s'})`}`
        : `<b>Nunca hiciste una copia.</b> Los datos están guardados en la nube (no se pierden si se rompe este dispositivo), pero conviene tener copias propias igual, por las dudas.`}
    </div>
    <button class="btn block" onclick="exportarBackup()">Descargar copia completa</button>
    <div class="note" style="margin-top:10px;">Baja un archivo <b>.json</b> con todo: alumnos, asistencias,
      cargos, pagos, gastos, usuarios y ajustes. Guardalo en Drive, mail o pendrive.
      Contiene datos personales de las alumnas: no lo compartas.</div>

    <div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin:16px 0 8px;">EXPORTAR PARA EXCEL</div>
    <div class="field-row">
      <button class="btn secondary sm" onclick="exportarCSV('alumnos')">Alumnos</button>
      <button class="btn secondary sm" onclick="exportarCSV('pagos')">Pagos</button>
    </div>
    <div class="field-row" style="margin-top:8px;">
      <button class="btn secondary sm" onclick="exportarCSV('gastos')">Gastos</button>
      <button class="btn secondary sm" onclick="exportarCSV('asistencias')">Asistencias</button>
    </div>

    <div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin:16px 0 8px;">DIAGNÓSTICO</div>
    <button class="btn ghost block" onclick="probarStorage()">Probar el guardado</button>

    ${esDueno?`<div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin:16px 0 8px;">RESTAURAR</div>
      <button class="btn ghost block" onclick="modalRestaurar()">Restaurar desde una copia</button>`:''}
  </div>

  <div class="card"><h3>Cupos por clase</h3><div class="field-row">
    <div><label>Camillas (Pilates)</label><input type="number" id="cu_p" value="${c.cupos.pilates}"></div>
    <div><label>Bicis (Indoor)</label><input type="number" id="cu_i" value="${c.cupos.indoor}"></div></div></div>

  <div class="card"><h3>Horarios de la grilla</h3>
    <div class="note" style="margin:8px 0;">Separados por coma, formato 24 hs.</div>
    <input id="cf_hrs" value="${c.horarios.join(', ')}"></div>

  <div class="card"><h3>Tarifas Pilates</h3><div class="field-row3">
    ${[1,2,3].map(f=>`<div><label>${f}x/sem</label><input type="number" id="tp_${f}" value="${c.tarifas.pilates[f]}"></div>`).join('')}</div></div>

  <div class="card"><h3>Tarifas Indoor</h3><div class="field-row3">
    ${[1,2,3].map(f=>`<div><label>${f}x/sem</label><input type="number" id="ti_${f}" value="${c.tarifas.indoor[f]}"></div>`).join('')}</div></div>

  <div class="card"><h3>Clase suelta</h3>
    <div class="note" style="margin:8px 0;">Precio por clase para quien no tiene plan mensual.</div>
    <div class="field-row">
      <div><label>Pilates</label><input type="number" id="ts_p" value="${(c.tarifaSuelta||{}).pilates||0}"></div>
      <div><label>Indoor</label><input type="number" id="ts_i" value="${(c.tarifaSuelta||{}).indoor||0}"></div>
    </div></div>

  <div class="card"><h3>Combos Pilates + Indoor</h3>
    <div class="note" style="margin:8px 0;">Precio fijo para quien hace las dos. Si la combinación no está cargada acá, se suman las dos tarifas por separado.</div>
    <div id="combosBox"></div>
    <button class="btn secondary sm" style="margin-top:10px;" onclick="addCombo()">+ Agregar combo</button></div>

  <div class="card"><h3>Momento de cobro</h3>
    <div class="note" style="margin:8px 0;">Define cuándo empieza a correr el plazo de pago de cada ciclo.</div>
    <select id="cf_momento">
      <option value="vencido" ${c.momentoCobro!=='adelantado'?'selected':''}>Al finalizar — paga en la primera clase del ciclo siguiente</option>
      <option value="adelantado" ${c.momentoCobro==='adelantado'?'selected':''}>Por adelantado — paga el primer día del ciclo</option>
    </select></div>

  <div class="card"><h3>Recargos por atraso</h3>
    <div class="note" style="margin:8px 0;">Se aplica <b>un solo</b> escalón: el más alto alcanzado. Los días se cuentan desde la fecha de pago del ciclo.</div>
    <label>Días de gracia</label><input type="number" id="cf_gracia" value="${c.diasGracia}">
    <div class="tier-row" style="font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:13px;">
      <span>Desde (días)</span><span>Tipo</span><span>Valor</span><span></span></div>
    <div id="tiersBox"></div>
    <button class="btn secondary sm" style="margin-top:10px;" onclick="addTier()">+ Agregar escalón</button></div>

  <button class="btn block" onclick="guardarConfig()">Guardar ajustes</button>`;
  setTimeout(()=>{pintarCombos();pintarTiers();},0);
  return h;
}
function pintarCombos(){
  const b=document.getElementById('combosBox'); if(!b) return;
  const cs=state.config.combos||[];
  b.innerHTML=cs.length?cs.map((c,i)=>`<div class="tier-row">
    <select onchange="setCombo(${i},'pilates',this.value)">${[1,2,3].map(f=>`<option value="${f}" ${Number(c.pilates)===f?'selected':''}>Pil ${f}x</option>`).join('')}</select>
    <select onchange="setCombo(${i},'indoor',this.value)">${[1,2,3].map(f=>`<option value="${f}" ${Number(c.indoor)===f?'selected':''}>Ind ${f}x</option>`).join('')}</select>
    <input type="number" value="${c.precio}" placeholder="Precio" onchange="setCombo(${i},'precio',this.value)">
    <button class="x-btn" onclick="delCombo(${i})">✕</button></div>`).join(''):`<div class="note">Sin combos cargados.</div>`;
}
function addCombo(){ state.config.combos.push({pilates:2,indoor:2,precio:0}); pintarCombos(); }
function setCombo(i,k,v){ state.config.combos[i][k]=Number(v); }
function delCombo(i){ state.config.combos.splice(i,1); pintarCombos(); }
function pintarTiers(){
  const b=document.getElementById('tiersBox'); if(!b) return;
  const ts=state.config.recargos||[];
  b.innerHTML=ts.length?ts.map((t,i)=>`<div class="tier-row">
    <input type="number" value="${t.desde}" onchange="setTier(${i},'desde',this.value)">
    <select onchange="setTier(${i},'tipo',this.value)">
      <option value="porcentaje" ${t.tipo==='porcentaje'?'selected':''}>%</option>
      <option value="fijo" ${t.tipo==='fijo'?'selected':''}>$ fijo</option></select>
    <input type="number" value="${t.valor}" onchange="setTier(${i},'valor',this.value)">
    <button class="x-btn" onclick="delTier(${i})">✕</button></div>`).join(''):`<div class="note">Sin escalones.</div>`;
}
function addTier(){ state.config.recargos.push({desde:0,tipo:'porcentaje',valor:0}); pintarTiers(); }
function setTier(i,k,v){ state.config.recargos[i][k]=k==='tipo'?v:Number(v); }
function delTier(i){ state.config.recargos.splice(i,1); pintarTiers(); }
function guardarConfig(){
  const c=state.config;
  c.cupos.pilates=Number(document.getElementById('cu_p').value)||6;
  c.cupos.indoor=Number(document.getElementById('cu_i').value)||8;
  const hrs=document.getElementById('cf_hrs').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(hrs.length) c.horarios=hrs.sort();
  [1,2,3].forEach(f=>{
    c.tarifas.pilates[f]=Number(document.getElementById('tp_'+f).value)||0;
    c.tarifas.indoor[f]=Number(document.getElementById('ti_'+f).value)||0; });
  c.tarifaSuelta={pilates:Number(document.getElementById('ts_p').value)||0,
                  indoor:Number(document.getElementById('ts_i').value)||0};
  c.diasGracia=Number(document.getElementById('cf_gracia').value)||0;
  const momentoPrev=c.momentoCobro;
  c.momentoCobro=document.getElementById('cf_momento').value;
  c.recargos.sort((a,b)=>Number(a.desde)-Number(b.desde));
  if(momentoPrev!==c.momentoCobro){
    // cambió la política: se recalcula el vencimiento de los ciclos aún impagos.
    // Las clases sueltas quedan afuera: son exigibles el mismo día siempre,
    // sin importar el momento de cobro configurado para los ciclos.
    state.cargos.filter(x=>!x.pagado&&x.tipo!=='suelta').forEach(x=>{
      const al=state.alumnos.find(a=>a.id===x.alumnoId);
      if(al) x.vence=vencimientoDeCiclo(x.desde,x.hasta,al);
    });
    save('cargos');
  }
  save('config'); pintarVista(); showToast('Ajustes guardados.');
}

// Cuando alguien abre el link del mail de "recuperar contraseña", Supabase
// arma acá una sesión temporal y dispara este evento: se muestra la pantalla
// para elegir la contraseña nueva en vez de la app normal.
sb.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){ recuperando=true; render(); }
});

/* ═════════ ACTUALIZACIÓN AUTOMÁTICA ═════════
   El teléfono guarda una copia de la app para que abra rápido, y esa copia
   puede quedar vieja después de publicar una versión nueva. Acá se pide el
   archivo al servidor salteando esa copia y, si la versión publicada es
   distinta a la que está corriendo, se recarga sola. Si algo falla (sin
   internet, por ejemplo), no pasa nada: sigue andando la versión actual. */
const VERSION_APP=(document.querySelector('meta[name="app-version"]')||{}).content||'';
let _ultimoChequeo=0;
async function buscarActualizacion(){
  try{
    if(!VERSION_APP) return;
    if(Date.now()-_ultimoChequeo<600000) return; // no más de una vez cada 10 min
    _ultimoChequeo=Date.now();
    // Si ya se recargó buscando esta misma versión, no se insiste (evita
    // quedar recargando en loop si el servidor sigue entregando la vieja).
    const yaIntentada=new URLSearchParams(location.search).get('v');
    const r=await fetch(location.pathname+'?_ac='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const texto=await r.text();
    const m=texto.match(/<meta name="app-version" content="([^"]+)"/);
    if(!m) return;
    const publicada=m[1];
    if(publicada===VERSION_APP||publicada===yaIntentada) return;
    // Nunca se recarga con algo abierto a medias ni con cambios sin guardar:
    // se perdería lo que se está cargando. Queda para la próxima vez que se
    // abra la app.
    const modal=document.getElementById('modalRoot');
    if(modal&&modal.innerHTML.trim()) return;
    if(hayPendientes()) return;
    location.replace(location.pathname+'?v='+encodeURIComponent(publicada));
  }catch(e){ /* sin conexión o servidor caído: se sigue con la versión actual */ }
}
buscarActualizacion();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) buscarActualizacion(); });

loadAll();
</script>
