<style>
  :root{
    --bg:#EFF2ED; --surface:#FFFFFF; --surface-2:#F6F7F4;
    --ink:#1E2422; --ink-soft:#5C6660; --ink-faint:#8B948D;
    --line:#DCE3DA;
    --fijo-soft:#E3ECE3; --fijo-ink:#2E4A37;
    --unico-soft:#F7E6DA; --unico-ink:#8A3B18;
    --warn:#9A7A15; --warn-soft:#F3EAD1;
    --danger:#B3402F; --danger-soft:#F5DFDA;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(30,36,34,.06), 0 4px 14px rgba(30,36,34,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; padding-bottom:60px;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:-.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:1000px; margin:0 auto; padding:0 14px;}

  header.top{padding:18px 4px 10px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  header.top h1{font-size:24px;}
  header.top p{margin:3px 0 0; color:var(--ink-soft); font-size:12.5px;}
  .whoami{flex:0 0 auto; text-align:right;}
  .whoami .nm{font-size:12px; font-weight:600;}
  .whoami .rl{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}

  nav.tabs{position:sticky; top:0; z-index:20; display:flex; gap:6px;
    background:var(--bg); padding:6px 4px 12px; overflow-x:auto; scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{flex:0 0 auto; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); font-family:inherit; font-weight:600; font-size:13px;
    padding:9px 15px; border-radius:999px; cursor:pointer;}
  nav.tabs button.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px; margin-bottom:11px; box-shadow:var(--shadow);}
  .card.flat{box-shadow:none;}
  .card h3{font-size:15px; margin-bottom:4px;}
  .grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:9px; margin-bottom:16px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px;}
  .stat .num{font-family:'Fraunces',serif; font-size:24px; font-weight:600;}
  .stat .label{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  .badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700;
    letter-spacing:.03em; padding:3px 8px; border-radius:999px; text-transform:uppercase;}
  .badge.pilates,.badge.fijo,.badge.ok{background:var(--fijo-soft); color:var(--fijo-ink);}
  .badge.indoor,.badge.unico{background:var(--unico-soft); color:var(--unico-ink);}
  .badge.flotante{background:#E6E9F2; color:#3B4A72;}
  .badge.movido{background:#EDE4F3; color:#5B3A72;}
  .ocup.movida{opacity:.55;}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.deuda{background:var(--danger-soft); color:var(--danger);}
  .badge.gris{background:var(--surface-2); color:var(--ink-faint);}

  .list-item{display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:11px 3px; border-bottom:1px solid var(--line); cursor:pointer;}
  .list-item:last-child{border-bottom:none;}
  .list-item .name{font-weight:600; font-size:14.5px;}
  .list-item .meta{font-size:12px; color:var(--ink-soft); margin-top:3px;}

  .btn{border:none; border-radius:999px; padding:10px 17px; font-family:inherit;
    font-weight:600; font-size:13px; cursor:pointer; background:var(--ink); color:#fff;}
  .btn.secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
  .btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn.block{width:100%;}
  .btn.sm{padding:7px 13px; font-size:12px;}
  .fab-row{display:flex; justify-content:flex-end; gap:8px; margin-bottom:12px;}

  input,select,textarea{width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:var(--radius-sm); font-family:inherit; font-size:14px;
    background:var(--surface); color:var(--ink);}
  textarea{resize:vertical; min-height:58px;}
  label{font-size:12px; color:var(--ink-soft); font-weight:600; display:block; margin:12px 0 5px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px;}
  .empty{text-align:center; padding:32px 16px; color:var(--ink-soft); font-size:14px;}
  .empty .glyph{font-size:26px; margin-bottom:7px; opacity:.5;}

  .day-strip{display:flex; gap:5px; overflow-x:auto; scrollbar-width:none; margin-bottom:6px;}
  .day-strip::-webkit-scrollbar{display:none;}
  .day-chip{flex:0 0 auto; border:1px solid var(--line); background:var(--surface);
    border-radius:var(--radius-sm); padding:7px 11px; cursor:pointer; text-align:center; min-width:56px;}
  .day-chip.active{background:var(--ink); border-color:var(--ink); color:#fff;}
  .day-chip .dn{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .day-chip .dd{font-size:11px; opacity:.7; margin-top:2px;}
  .week-bar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .week-bar .lbl{font-size:12.5px; color:var(--ink-soft); font-weight:600; text-align:center;}

  .slot-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    margin-bottom:7px; overflow:hidden;}
  .slot-head{display:flex; align-items:center; gap:10px; padding:11px 13px; cursor:pointer;}
  .slot-head .hora{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; flex:0 0 auto;}
  .slot-head .cupo{margin-left:auto; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; flex:0 0 auto;}
  .cupo.libre{background:var(--fijo-soft); color:var(--fijo-ink);}
  .cupo.lleno{background:var(--danger-soft); color:var(--danger);}
  .slot-head .prev{font-size:12px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; flex:1; min-width:0;}
  .slot-body{border-top:1px solid var(--line); padding:6px 13px 12px;}
  .ocup{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px dashed var(--line);}
  .ocup:last-of-type{border-bottom:none;}
  .ocup .nm{flex:1; font-size:13.5px; font-weight:500; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ocup.falto .nm{text-decoration:line-through; opacity:.5;}
  .mini-btn{border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft);
    font-size:11px; font-weight:600; padding:5px 9px; border-radius:999px; cursor:pointer;
    font-family:inherit; flex:0 0 auto;}
  .mini-btn.on-p{background:var(--fijo-soft); color:var(--fijo-ink); border-color:transparent;}
  .mini-btn.on-a{background:var(--danger-soft); color:var(--danger); border-color:transparent;}

  .modal-overlay{position:fixed; inset:0; background:rgba(30,36,34,.45);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal{background:var(--surface); border-radius:18px 18px 0 0; padding:20px 17px 26px;
    width:100%; max-width:500px; max-height:90vh; overflow-y:auto;}
  @media(min-width:560px){ .modal-overlay{align-items:center;} .modal{border-radius:18px;} }
  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600;
    z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; max-width:88%; text-align:center;}
  .toast.show{opacity:1;}
  .note{background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px;
    font-size:12.5px; color:var(--ink-soft); line-height:1.55;}
  .note.aviso{background:var(--warn-soft); color:var(--warn);}
  .alert{background:var(--warn-soft); color:var(--warn); border-radius:var(--radius-sm);
    padding:10px 12px; font-size:13px; font-weight:600; margin-bottom:11px;}
  .tier-row{display:grid; grid-template-columns:1fr 1fr 1fr 36px; gap:6px; align-items:center; margin-top:7px;}
  .tier-row input,.tier-row select{padding:8px 9px; font-size:13px;}
  .x-btn{border:1px solid var(--line); background:var(--surface-2); color:var(--danger);
    border-radius:var(--radius-sm); cursor:pointer; font-size:14px; padding:9px 0; font-family:inherit;}
  .seg{display:flex; gap:5px; margin-bottom:12px;}
  .seg button{flex:1; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    font-family:inherit; font-weight:600; font-size:12.5px; padding:9px 4px; border-radius:999px; cursor:pointer;}
  .seg button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .hist-row{display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .hist-row:last-child{border-bottom:none;}

  /* Login */
  .auth-wrap{max-width:400px; margin:0 auto; padding:52px 18px;}
  .auth-wrap h1{font-size:30px; margin-bottom:5px;}
  .auth-wrap .sub{color:var(--ink-soft); font-size:13.5px; margin-bottom:24px;}
  .perm-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .perm-row:last-child{border-bottom:none;}
  .perm-row input[type=checkbox]{width:19px; height:19px; flex:0 0 auto; accent-color:var(--ink);}
  .perm-row .txt{flex:1;}
  .perm-row .txt b{font-size:13.5px; font-weight:600; display:block;}
  .perm-row .txt span{font-size:11.5px; color:var(--ink-faint);}
  .bar-row{margin:9px 0;}
  .bar-row .top{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;}
  .bar-track{height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px;}
</style>
</head>
<body>
<div id="bannerStorage" style="display:none;position:sticky;top:0;z-index:80;
  background:var(--danger-soft);color:var(--danger);padding:11px 14px;font-size:13px;line-height:1.5;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ═════════ SUPABASE ═════════ */
const SUPABASE_URL='https://oklwllhrtqmebknjmyea.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rbHdsbGhydHFtZWJrbmpteWVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzY5MDksImV4cCI6MjEwMjc1MjkwOX0.7sM73NpRpXHh2ftTdBpkbPYOl3TtBBgQq9w7Ac-UHOE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ═════════ CONSTANTES ═════════ */
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DIAS_CORTO=['Lun','Mar','Mié','Jue','Vie','Sáb'];
const SEMANAS_CICLO=4;
const CAT_GASTOS=['Sueldos','Alquiler','Servicios','Mantenimiento','Insumos','Impuestos','Marketing','Otros'];
const DISC_GASTO=[['pilates','Pilates'],['indoor','Indoor'],['compartido','Compartido']];

const PERMISOS=[
  {k:'agenda_ver',    n:'Ver la agenda',            d:'Consultar quién viene a cada clase'},
  {k:'agenda_editar', n:'Marcar asistencias',       d:'Vino / Faltó y anotar por única vez'},
  {k:'alumnos_ver',   n:'Ver alumnos',              d:'Fichas, patologías y turnos'},
  {k:'alumnos_editar',n:'Crear y editar alumnos',   d:'Altas, cambios de turno, bajas'},
  {k:'pagos_ver',     n:'Ver estado de cuenta',     d:'Quién debe y cuánto'},
  {k:'pagos_editar',  n:'Registrar cobros',         d:'Cobrar, editar y anular pagos'},
  {k:'finanzas',      n:'Gastos y balance',         d:'Ingresos, egresos y resultado'},
  {k:'ajustes',       n:'Ajustes del estudio',      d:'Tarifas, cupos, horarios y recargos'},
  {k:'usuarios',      n:'Gestionar usuarios',       d:'Crear cuentas y asignar permisos'}
];
const PERM_DUENO = PERMISOS.reduce((o,p)=>(o[p.k]=true,o),{});

/* ═════════ ESTADO ═════════ */
let state={
  alumnos:[], unicos:[], flotantes:[], cambios:[], asistencias:[], cargos:[], pagos:[], gastos:[], usuarios:[], accesosLog:[],
  config:{
    cupos:{pilates:6,indoor:8},
    horarios:['08:00','09:00','10:00','11:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'],
    tarifas:{pilates:{1:0,2:0,3:0},indoor:{1:0,2:0,3:0}},
    tarifaSuelta:{pilates:0,indoor:0},
    combos:[],
    recargos:[{desde:4,tipo:'porcentaje',valor:5},{desde:8,tipo:'porcentaje',valor:10},
              {desde:13,tipo:'porcentaje',valor:15},{desde:19,tipo:'porcentaje',valor:20}],
    diasGracia:3,
    momentoCobro:'vencido'
  }
};
let sesion=null;
let hayDueno=false;
let tab='inicio', agDisc='pilates', agAbierto=null, busqueda='', verInactivos=false;
let balModo='mes', balOffset=0;
// Verificación en dos pasos: mfaPending es el desafío pendiente durante el login
// (todavía sin sesión "usable"); miMfaFactor es el factor TOTP ya activado del
// usuario logueado (o null), para mostrar su estado en pantalla sin re-consultar.
let mfaPending=null, miMfaFactor=null;
// true mientras el usuario está completando el link de "olvidé mi contraseña"
// (en ese momento hay una sesión temporal de recuperación, pero no se debe
// entrar a la app todavía: primero tiene que elegir la contraseña nueva).
let recuperando=false;

/* ═════════ FECHAS ═════════ */
function todayStr(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
let agFecha=todayStr();
function fmt(s){ if(!s) return '—'; const p=s.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }
function fmtCorto(s){ const p=s.split('-'); return `${p[2]}/${p[1]}`; }
function addDays(s,n){ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function diff(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5); }
function diaDe(f){ return DIAS[(new Date(f+'T12:00:00').getDay()+6)%7]; }
function uid(){ return crypto.randomUUID(); }
function esCumpleHoy(a){
  if(!a.fechaNacimiento) return false;
  const hoy=todayStr().slice(5), nac=a.fechaNacimiento.slice(5);
  return hoy===nac;
}
function edadCumple(a){
  const nac=Number(a.fechaNacimiento.slice(0,4)), hoy=Number(todayStr().slice(0,4));
  return hoy-nac;
}
function soloNumeros(s){ return String(s||'').replace(/\D/g,''); }
/* Arma el número en formato internacional para WhatsApp (54 9 + código de área + número).
   Da por hecho que el teléfono se cargó como número argentino de 10 dígitos,
   sin el 0 de salida ni el 15 de celular (ej: 3511234567), que es como conviene
   guardarlo para que el link funcione bien. */
function telWhatsapp(tel){
  let d=soloNumeros(tel); if(!d) return '';
  if(d.startsWith('54')) d=d.slice(2);
  if(d.startsWith('0')) d=d.slice(1);
  if(!d.startsWith('9')) d='9'+d;
  return '54'+d;
}
/* Evita envíos duplicados: si alguien toca "Guardar" dos veces seguidas
   (por ejemplo porque tarda un momento en responder por la red), la
   segunda vez se ignora en lugar de crear un registro repetido. */
const _bloqueos=new Set();
function bloqueado(clave){ if(_bloqueos.has(clave)) return true; _bloqueos.add(clave); return false; }
function desbloquear(clave){ _bloqueos.delete(clave); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '$'+Number(n||0).toLocaleString('es-AR'); }
function lunesDe(f){ return addDays(f,-((new Date(f+'T12:00:00').getDay()+6)%7)); }
// El estudio no abre los domingos: la agenda se corre al lunes siguiente
function diaHabil(f){ return diaDe(f)==='Domingo'?addDays(f,1):f; }

/* ═════════ PERSISTENCIA (Supabase) ═════════ */
const KEYS=['alumnos','unicos','flotantes','asistencias','cargos','pagos','gastos','usuarios','config'];

/* --- Conversión entre el formato interno (camelCase, igual que siempre)
   y las filas de las tablas de Supabase (snake_case). Toda la lógica de
   negocio de más abajo sigue usando el mismo formato de siempre: sólo acá
   se traduce hacia y desde la base. --- */
function alumnoADb(a){ return {nombre:a.nombre,dni:a.dni||null,telefono:a.telefono||null,
  patologia:a.patologia||null,fecha_nacimiento:a.fechaNacimiento||null,ciclo_desde:a.cicloDesde||null,activo:a.activo,
  fecha_alta:a.fechaAlta,fecha_baja:a.fechaBaja||null,
  consentimiento_firmado:!!a.consentimientoFirmado,consentimiento_fecha:a.consentimientoFecha||null}; }
function unicoADb(u){ return {alumno_id:u.alumnoId,disciplina:u.disciplina,fecha:u.fecha,horario:u.horario}; }
function flotanteADb(f){ return {alumno_id:f.alumnoId,disciplina:f.disciplina,fecha:f.fecha,horario:f.horario}; }
function cambioADb(x){ return {alumno_id:x.alumnoId,disciplina:x.disciplina,
  fecha_origen:x.fechaOrigen,hora_origen:x.horaOrigen,
  fecha_destino:x.fechaDestino,hora_destino:x.horaDestino,creado_por:x.creadoPor||null}; }
function asistenciaADb(x){ return {alumno_id:x.alumnoId,disciplina:x.disciplina,fecha:x.fecha,horario:x.horario,estado:x.estado}; }
function cargoADb(c){ return {alumno_id:c.alumnoId,tipo:c.tipo,desde:c.desde,hasta:c.hasta,vence:c.vence,
  monto:c.monto,detalle:c.detalle||null,reparto_pilates:(c.reparto&&c.reparto.pilates)||0,
  reparto_indoor:(c.reparto&&c.reparto.indoor)||0,pagado:c.pagado,fecha_pago:c.fechaPago||null,
  recargo_pagado:(c.recargoPagado==null?null:c.recargoPagado)}; }
function pagoADb(p){ return {alumno_id:p.alumnoId,cargo_id:p.cargoId||null,fecha:p.fecha,monto:p.monto,
  recargo:p.recargo||0,nota:p.nota||null,registrado_por:p.registradoPor||null}; }
function gastoADb(g){ return {categoria:g.categoria,disciplina:g.disciplina||'compartido',detalle:g.detalle||null,
  monto:g.monto,fecha:g.fecha,proveedor:g.proveedor||null,registrado_por:g.registradoPor||null}; }

const TABLAS_ARRAY={
  alumnos:{tabla:'alumnos',aDb:alumnoADb}, unicos:{tabla:'unicos',aDb:unicoADb},
  flotantes:{tabla:'flotantes',aDb:flotanteADb},
  // Estas dos tablas tienen además una restricción de unicidad "de negocio"
  // (una sola fila por alumno+disciplina+turno), separada del id. Si dos
  // dispositivos marcan la misma clase casi al mismo tiempo con una copia
  // local desactualizada, cada uno puede generar un id nuevo para esa misma
  // fila: sin decirle a Postgres contra qué columnas resolver el conflicto,
  // eso choca con esa restricción y la escritura queda rechazada (error 409).
  // Indicando el "onConflict" correcto, en vez de fallar actualiza la fila
  // que ya existe.
  cambios:{tabla:'cambios',aDb:cambioADb,onConflict:'alumno_id,disciplina,fecha_origen,hora_origen'},
  asistencias:{tabla:'asistencias',aDb:asistenciaADb,onConflict:'alumno_id,disciplina,fecha,horario'},
  cargos:{tabla:'cargos',aDb:cargoADb}, pagos:{tabla:'pagos',aDb:pagoADb}, gastos:{tabla:'gastos',aDb:gastoADb}
};

/* Sincroniza un array completo del estado contra su tabla: inserta/actualiza
   lo que está en el array (upsert por id) y borra en la base lo que
   nosotros mismos habíamos cargado antes y ya no está.
   Importante: sólo se manda al servidor lo que es NUEVO o CAMBIÓ desde el
   último guardado exitoso (comparando contra _snapConocidos). Antes se
   reenviaba el array completo en cada guardado: como el upsert resuelve
   por "insertar o actualizar", eso equivalía a intentar ACTUALIZAR también
   las filas viejas que ni se habían tocado. En una tabla como 'cargos',
   donde crear una fila nueva y modificar una existente requieren permisos
   distintos, eso hacía que una empleada sin permiso para editar pagos no
   pudiera ni generar un cargo nuevo: el intento de "actualizar" (sin cambios
   reales) los cargos viejos ya cargados era rechazado por los permisos de la
   base, y esa única fila rechazada hacía fallar todo el guardado. */
let _idsConocidos={}, _snapConocidos={};
function snapshotDe(filas,aDb){
  const o={}; filas.forEach(f=>{ o[f.id]=JSON.stringify({id:f.id,...aDb(f)}); }); return o;
}
async function sincronizarTabla(tabla,filas,aDb,onConflict){
  const idsActuales=new Set(filas.map(f=>f.id));
  const idsPrevios=_idsConocidos[tabla]||new Set();
  const aBorrar=[...idsPrevios].filter(id=>!idsActuales.has(id));
  const snapPrev=_snapConocidos[tabla]||{};
  const snapNuevo=snapshotDe(filas,aDb);
  const rows=filas.map(f=>({id:f.id,...aDb(f)})).filter(f=>snapPrev[f.id]!==snapNuevo[f.id]);
  if(rows.length){
    const {error}=await sb.from(tabla).upsert(rows,onConflict?{onConflict}:undefined);
    if(error) throw error;
  }
  if(aBorrar.length){
    const {error}=await sb.from(tabla).delete().in('id',aBorrar);
    if(error) throw error;
  }
  _idsConocidos[tabla]=idsActuales;
  _snapConocidos[tabla]=snapNuevo;
}
/* Cierra la versión de turnos vigente y abre una nueva a partir de `desde`.
   Las semanas anteriores conservan los horarios que regían entonces. */
async function sincronizarInscripciones(alumnoId,inscripciones,desde){
  desde=desde||todayStr();
  // Una sola llamada atómica: cierra la versión anterior e inserta la nueva
  // dentro de la misma transacción. Si falla algo, no queda a medias.
  const {error}=await sb.rpc('reemplazar_inscripciones',{
    p_alumno:alumnoId,
    p_desde:desde,
    p_datos:(inscripciones||[]).map(i=>({
      disciplina:i.disciplina,
      frecuencia:Number(i.frecuencia),
      slots:(i.slots||[]).map(s=>({tipo:s.tipo||'fijo',dia:s.dia||'',horario:s.horario||''}))
    }))
  });
  if(error) throw error;
}

  // Las inscripciones se agrupan por ventana de vigencia: cada grupo es una
  // versión del horario. La vigente hoy (vigente_hasta null) es a.inscripciones.

  state.cambios=(cbRes.data||[]).map(r=>({id:r.id,alumnoId:r.alumno_id,disciplina:r.disciplina,

  state.flotantes=(flRes.data||[]).map(r=>({id:r.id,alumnoId:r.alumno_id,disciplina:r.disciplina,fecha:r.fecha,horario:r.horario}));

  state.cargos=(caRes.data||[]).map(r=>({id:r.id,alumnoId:r.alumno_id,tipo:r.tipo,desde:r.desde,hasta:r.hasta,

  state.pagos=(paRes.data||[]).map(r=>({id:r.id,alumnoId:r.alumno_id,cargoId:r.cargo_id,fecha:r.fecha,
    monto:Number(r.monto),recargo:Number(r.recargo||0),nota:r.nota||'',registradoPor:r.registrado_por||''}));
  state.gastos=(gaRes.data||[]).map(r=>({id:r.id,categoria:r.categoria,disciplina:r.disciplina,
    detalle:r.detalle||'',monto:Number(r.monto),fecha:r.fecha,proveedor:r.proveedor||'',registradoPor:r.registrado_por||''}));

  state.usuarios=(peRes.data||[]).map(r=>({id:r.id,nombre:r.nombre,email:r.email,rol:r.rol,
    permisos:r.permisos||{},activo:r.activo,creado:r.creado}));

  _idsConocidos={
    alumnos:new Set(state.alumnos.map(a=>a.id)), unicos:new Set(state.unicos.map(a=>a.id)),
    flotantes:new Set(state.flotantes.map(a=>a.id)), cambios:new Set(state.cambios.map(a=>a.id)),
    asistencias:new Set(state.asistencias.map(a=>a.id)),
    cargos:new Set(state.cargos.map(a=>a.id)), pagos:new Set(state.pagos.map(a=>a.id)),
    gastos:new Set(state.gastos.map(a=>a.id))
  };
  _snapConocidos={};
  Object.keys(TABLAS_ARRAY).forEach(k=>{ _snapConocidos[k]=snapshotDe(state[k],TABLAS_ARRAY[k].aDb); });
}

/* Escritura agrupada: varios cambios seguidos se juntan en una sola tanda,
   se espacian entre sí y se reintentan. Así no se satura la conexión. */
let _pend=new Set(), _timer=null, _resolvers=[], _flushing=false;
let modoSoloMemoria=false, ultimoErrorStorage='', ultimoGuardadoOk=null;

function save(key){
  _pend.add(key);
  return new Promise(res=>{
    _resolvers.push(res);
    // Ventana FIJA de 450 ms desde el primer cambio sin guardar: los toques que
    // caen dentro se juntan en una sola escritura, pero no la corren para
    // adelante. Antes cada toque reiniciaba la espera, así que marcando rápido
    // no se guardaba nada hasta frenar — y si la página se recargaba en el medio
    // (por una actualización o porque el teléfono descartó la pestaña), esas
    // marcas se perdían enteras.
    if(!_timer) _timer=setTimeout(()=>{ _timer=null; flush(); },450);
  });
}
function hayPendientes(){ return _pend.size>0||_flushing||!!_timer||modoSoloMemoria; }
/* Guarda en el acto, sin esperar la ventana. Se usa cuando la app pasa a
   segundo plano —cambia de app, bloquea el teléfono, cierra la pestaña— y al
   marcar asistencias, que es lo que se carga de a muchas y seguidas. */
function guardarYa(){
  if(_timer){ clearTimeout(_timer); _timer=null; }
  if(_pend.size) flush();
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) guardarYa(); });
window.addEventListener('pagehide',guardarYa);
async function escribirClave(k,intento){
  intento=intento||0;
  try{
    if(k==='config') await escribirConfig();
    else if(k==='usuarios'){ /* los cambios de usuarios se escriben directo, no por acá */ }
    else if(TABLAS_ARRAY[k]) await sincronizarTabla(TABLAS_ARRAY[k].tabla,state[k],TABLAS_ARRAY[k].aDb,TABLAS_ARRAY[k].onConflict);
    return true;
  }catch(e){
    ultimoErrorStorage=(e&&e.message)?e.message:String(e);
    if(intento<3){ await new Promise(r=>setTimeout(r,700*(intento+1))); return escribirClave(k,intento+1); }
    return false;
  }
}
async function flush(){
  if(_flushing) return;
  _flushing=true;
  const keys=[..._pend]; _pend.clear();
  let fallo=false;
  for(const k of keys){
    const ok=await escribirClave(k);
    if(!ok) fallo=true;
    await new Promise(r=>setTimeout(r,150)); // espaciado entre escrituras
  }
  _flushing=false;
  if(fallo){ modoSoloMemoria=true; }
  else { modoSoloMemoria=false; ultimoGuardadoOk=new Date(); }
  const rs=_resolvers; _resolvers=[]; rs.forEach(r=>r(!fallo));
  actualizarBanner();
  if(_pend.size) flush();
}
function actualizarBanner(){
  const b=document.getElementById('bannerStorage');
  if(!b) return;
  if(modoSoloMemoria){
    b.style.display='block';
    b.innerHTML=`<b>⚠ Los cambios no se están guardando.</b>
      Todo lo que cargaste sigue en pantalla, pero se perderá al cerrar.
      <button class="mini-btn" style="margin-left:8px;background:#fff;" onclick="exportarBackup()">Descargar copia ahora</button>
      <button class="mini-btn" style="margin-left:6px;background:#fff;" onclick="probarStorage()">Reintentar</button>`;
  } else b.style.display='none';
}
async function probarStorage(){
  let msg='';
  try{
    const {error}=await sb.from('config').select('id').limit(1);
    if(error) throw error;
    KEYS.filter(k=>k!=='usuarios').forEach(k=>_pend.add(k));
    await flush();
    msg = modoSoloMemoria ? '✗ Sigue fallando al guardar los datos.' : '✓ Conexión con Supabase OK. Guardado correctamente.';
  }catch(e){ msg='✗ '+((e&&e.message)?e.message:String(e)); }
  document.getElementById('modalRoot').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)cerrar()"><div class="modal">
    <h2 style="margin-bottom:10px;">Diagnóstico de guardado</h2>
    <div class="note" style="line-height:1.6;">${esc(msg)}<br><br>
      Último error registrado: <b>${esc(ultimoErrorStorage||'ninguno')}</b><br>
      Último guardado correcto: <b>${ultimoGuardadoOk?ultimoGuardadoOk.toLocaleString('es-AR'):'ninguno en esta sesión'}</b></div>
    <div class="note aviso" style="margin-top:10px;">Si esto falla de forma repetida, descargá una copia de seguridad
      antes de cerrar y avisame: hay que pasar los datos a un servidor.</div>
    <button class="btn block" style="margin-top:14px;" onclick="exportarBackup()">Descargar copia</button>
    <button class="btn ghost block" style="margin-top:9px;" onclick="cerrar()">Cerrar</button>
  </div></div>`;
  actualizarBanner();
}

/* ═════════ AUTENTICACIÓN (Supabase Auth) ═════════
   El login y las contraseñas los maneja Supabase. Crear cuentas nuevas
   (la de la dueña, y luego las del equipo) pasa por la función
   "crear-usuario", que usa permisos de administrador para crearlas ya
   confirmadas, sin pedir verificación de email.                         */
function validarPass(p){
  if(!p||p.length<8) return 'La contraseña debe tener al menos 8 caracteres.';
  if(!/[a-zA-Z]/.test(p)||!/[0-9]/.test(p)) return 'Debe combinar letras y números.';
  return null;
}
function emailOk(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||''); }
function usuarioActual(){ return sesion?state.usuarios.find(u=>u.id===sesion.userId):null; }
function puede(k){
  const u=usuarioActual(); if(!u) return false;
  if(u.rol==='dueño') return true;
  return !!(u.permisos||{})[k];
}
// A diferencia de puede(), esto NO se puede otorgar por permisos: es exclusivo
// del rol dueño, para acciones irreversibles como eliminar un alumno.
function esDueño(){ const u=usuarioActual(); return !!u&&u.rol==='dueño'; }
async function cerrarSesion(){

  sesion=null; miMfaFactor=null;
  tab='inicio'; render();
}

/* ═════════ VERIFICACIÓN EN DOS PASOS (MFA / TOTP) ═════════
   Cada usuario activa esto para su propia cuenta, desde la pantalla de Inicio.
   Usa el sistema nativo de Supabase Auth (no guardamos ningún secreto nuestro). */
async function refrescarMiMFA(){
  try{
    const {data}=await sb.auth.mfa.listFactors();
    miMfaFactor=(data&&data.totp||[]).find(f=>f.status==='verified')||null;
  }catch(e){ miMfaFactor=null; }
}
async function activarMFA(){
  const {data,error}=await sb.auth.mfa.enroll({factorType:'totp'});
  if(error) return showToast('No se pudo iniciar la activación: '+error.message);
  window._mfaEnroll=data;
  document.getElementById('modalRoot').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)cancelarActivarMFA()"><div class="modal">
    <h2 style="margin-bottom:8px;">Activar verificación en dos pasos</h2>
    <div class="note" style="margin-bottom:12px;">Escaneá este código QR con una app de autenticación
      (Google Authenticator, Authy, Microsoft Authenticator...) o ingresá la clave manualmente.
      Después escribí acá el código de 6 dígitos que te muestre la app.</div>
    <div style="text-align:center;margin:14px 0;"><img src="${esc(data.totp.qr_code)}" alt="Código QR" style="max-width:220px;width:100%;height:auto;"></div>
    <div class="note mono" style="text-align:center;word-break:break-all;">${esc(data.totp.secret)}</div>
    <label>Código de la app</label><input id="mfa_setup_code" inputmode="numeric" maxlength="6"
      onkeydown="if(event.key==='Enter')confirmarActivarMFA()">
    <button class="btn block" style="margin-top:14px;" onclick="confirmarActivarMFA()">Confirmar y activar</button>
    <button class="btn ghost block" style="margin-top:9px;" onclick="cancelarActivarMFA()">Cancelar</button>
    <div id="mfa_setup_err" style="color:var(--danger);font-size:13px;margin-top:10px;text-align:center;"></div>
  </div></div>`;
}
async function confirmarActivarMFA(){
  const code=document.getElementById('mfa_setup_code').value.trim();
  const factorId=window._mfaEnroll.id;
  const {data:ch,error:e1}=await sb.auth.mfa.challenge({factorId});
  if(e1){ document.getElementById('mfa_setup_err').textContent='No se pudo verificar. Probá de nuevo.'; return; }
  const {error:e2}=await sb.auth.mfa.verify({factorId,challengeId:ch.id,code});
  if(e2){ document.getElementById('mfa_setup_err').textContent='Código incorrecto.'; return; }
  window._mfaEnroll=null;
  await refrescarMiMFA();
  cerrar(); pintarVista(); showToast('Verificación en dos pasos activada.');
}
async function cancelarActivarMFA(){
  if(window._mfaEnroll){ try{ await sb.auth.mfa.unenroll({factorId:window._mfaEnroll.id}); }catch(e){} window._mfaEnroll=null; }
  cerrar();
}
async function desactivarMFA(){
  if(!miMfaFactor) return;
  if(!window.confirm('¿Desactivar la verificación en dos pasos de tu cuenta?')) return;
  const {error}=await sb.auth.mfa.unenroll({factorId:miMfaFactor.id});
  if(error) return showToast('No se pudo desactivar.');
  miMfaFactor=null; pintarVista(); showToast('Verificación en dos pasos desactivada.');
}

/* ═════════ COPIA DE SEGURIDAD ═════════ */
const BACKUP_VERSION=1;
function descargarArchivo(nombre,contenido,mime){
  try{
    const blob=new Blob(['\ufeff'+contenido],{type:mime+';charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=nombre;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
    return true;
  }catch(e){ console.error('descarga falló',e); return false; }
}
function armarBackup(){
  return JSON.stringify({
    _app:'estudio-pilates-indoor',
    _version:BACKUP_VERSION,
    _fecha:new Date().toISOString(),
    alumnos:state.alumnos, unicos:state.unicos, flotantes:state.flotantes,
    asistencias:state.asistencias, cargos:state.cargos, pagos:state.pagos,
    gastos:state.gastos, usuarios:state.usuarios, config:state.config
  },null,2);
}
function nombreBackup(){ return `estudio-backup-${todayStr()}.json`; }
async function exportarBackup(){
  const txt=armarBackup();
  const ok=descargarArchivo(nombreBackup(),txt,'application/json');

  else modalTextoManual('Copia de seguridad',txt,nombreBackup());

}
function csvEscape(v){
  const s=String(v==null?'':v);
  return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function armarCSV(filas){ return filas.map(f=>f.map(csvEscape).join(';')).join('\n'); }
function exportarCSV(tipo){
  let filas=[], nombre='';
  if(tipo==='alumnos'){
    nombre=`alumnos-${todayStr()}.csv`;
    filas=[['Nombre','DNI','Teléfono','Patología','Plan','Flotantes','Estado','Alta','Baja','Deuda']];
    state.alumnos.forEach(a=>filas.push([a.nombre,a.dni||'',a.telefono||'',a.patologia||'',
      (a.inscripciones||[]).map(i=>`${i.disciplina} ${i.frecuencia}x`).join(' + ')||'Clase suelta',
      flotantesDe(a), a.activo?'Activo':'Baja', a.fechaAlta||'', a.fechaBaja||'', deudaTotal(a.id)]));
  } else if(tipo==='pagos'){
    nombre=`pagos-${todayStr()}.csv`;
    filas=[['Fecha','Alumno','Monto','Recargo','Pilates','Indoor','Nota','Registró']];
    [...state.pagos].sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(p=>{
      const al=state.alumnos.find(x=>x.id===p.alumnoId), r=repartoPago(p);
      filas.push([p.fecha, al?al.nombre:'—', p.monto, p.recargo||0, r.pilates, r.indoor,
        p.nota||'', p.registradoPor||'']);
    });
  } else if(tipo==='gastos'){
    nombre=`gastos-${todayStr()}.csv`;
    filas=[['Fecha','Rubro','Disciplina','Detalle','Proveedor','Monto','Registró']];
    [...state.gastos].sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(g=>
      filas.push([g.fecha,g.categoria,g.disciplina||'compartido',g.detalle||'',
        g.proveedor||'',g.monto,g.registradoPor||'']));
  } else if(tipo==='asistencias'){
    nombre=`asistencias-${todayStr()}.csv`;
    filas=[['Fecha','Alumno','Disciplina','Horario','Estado']];
    [...state.asistencias].sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(x=>{
      const al=state.alumnos.find(y=>y.id===x.alumnoId);
      filas.push([x.fecha, al?al.nombre:'—', x.disciplina, x.horario, x.estado]);
    });
  }
  const txt=armarCSV(filas);
  if(!descargarArchivo(nombre,txt,'text/csv')) modalTextoManual('Exportación '+tipo,txt,nombre);
  else showToast('Archivo descargado.');
}

/* ═════════ RESTAURACIÓN ═════════ */
function modalRestaurar(){
  document.getElementById('modalRoot').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)cerrar()"><div class="modal">

function leerArchivoBackup(input){
  const f=input.files&&input.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>analizarBackup(r.result);
  r.onerror=()=>showToast('No se pudo leer el archivo.');
  r.readAsText(f);
}
function analizarPegado(){
  const t=document.getElementById('pegaBackup').value.trim();
  if(!t) return showToast('Pegá el contenido primero.');
  analizarBackup(t);
}
function analizarBackup(texto){
  let d;
  try{ d=JSON.parse(String(texto).replace(/^\ufeff/,'')); }
  catch(e){ return showToast('El archivo no es una copia válida.'); }
  if(!d||typeof d!=='object'||d._app!=='estudio-pilates-indoor')
    return showToast('Ese archivo no es una copia de esta app.');
  const arr=k=>Array.isArray(d[k])?d[k].length:0;
  window._backupPend=d;
  document.getElementById('previewBackup').innerHTML=`
    <div class="card flat" style="margin-top:14px;padding:13px;">
      <h3>Contenido de la copia</h3>
      <div style="font-size:12px;color:var(--ink-faint);margin:4px 0 8px;">
        Generada el ${d._fecha?fmt(String(d._fecha).slice(0,10)):'—'}</div>
      <div class="hist-row"><span>Alumnos</span><span class="mono">${arr('alumnos')}</span></div>
      <div class="hist-row"><span>Pagos</span><span class="mono">${arr('pagos')}</span></div>
      <div class="hist-row"><span>Cargos</span><span class="mono">${arr('cargos')}</span></div>
      <div class="hist-row"><span>Gastos</span><span class="mono">${arr('gastos')}</span></div>
      <div class="hist-row"><span>Asistencias</span><span class="mono">${arr('asistencias')}</span></div>
      <div class="hist-row"><span>Usuarios</span><span class="mono">${arr('usuarios')}</span></div>
    </div>
    <div class="note" style="margin-top:10px;">Hoy tenés ${state.alumnos.length} alumnos,
      ${state.pagos.length} pagos y ${state.gastos.length} gastos. Todo eso se reemplaza.</div>
    <button class="btn danger block" style="margin-top:12px;" onclick="confirmarRestauracion()">Reemplazar todo con esta copia</button>`;
}
async function confirmarRestauracion(){
  const d=window._backupPend;
  if(!d) return showToast('No hay copia cargada.');
  if(hayDatos()) descargarArchivo(`estudio-antes-de-restaurar-${todayStr()}.json`,armarBackup(),'application/json');
  // Los usuarios (cuentas de acceso) no se restauran desde la copia: son
  // cuentas reales de Supabase y no se pueden recrear desde un JSON.
  ['alumnos','unicos','flotantes','asistencias','cargos','pagos','gastos'].forEach(k=>{
    if(Array.isArray(d[k])) state[k]=d[k];
  });
  if(d.config&&typeof d.config==='object') state.config={...state.config,...d.config};
  for(const k of KEYS.filter(k=>k!=='usuarios')) await save(k);
  for(const a of state.alumnos) await sincronizarInscripciones(a.id,a.inscripciones||[]);
  window._backupPend=null;
  cerrar();
  generarCargosPendientes();
  render();
  showToast('Copia restaurada.');
}

/* ═════════ NEGOCIO ═════════ */
function frecTotal(al){ return (al.inscripciones||[]).reduce((s,i)=>s+Number(i.frecuencia||0),0); }
function diasDeClase(al){
  const s=new Set();
  (al.inscripciones||[]).forEach(i=>(i.slots||[]).forEach(x=>{ if(x.tipo!=='flotante') s.add(x.dia); }));
  return s;
}
// Cuántas clases fijas (de cualquier disciplina) tiene el alumno en un día de la semana dado.
// Hace falta para el conteo del ciclo: si un día tiene dos clases (ej. pilates e indoor
// el mismo martes), ese día tiene que sumar 2, no 1 — si no, el ciclo se alarga de más.
function clasesEnDia(al,diaSemana){
  let n=0;
  (al.inscripciones||[]).forEach(i=>(i.slots||[]).forEach(x=>{
    if(x.tipo!=='flotante'&&x.dia===diaSemana) n++;
  }));
  return n;
}
function flotantesDe(al,disc,fecha){
  const ins=fecha?inscripcionesEn(al,fecha):(al.inscripciones||[]);
  return ins.filter(i=>!disc||i.disciplina===disc)
    .reduce((n,i)=>n+(i.slots||[]).filter(s=>s.tipo==='flotante').length,0);
}
// Flotantes ya ubicados en la semana de `fecha`
function flotantesUbicados(alId,disc,fecha){
  const l=lunesDe(fecha), f=addDays(l,6);
  return state.flotantes.filter(x=>x.alumnoId===alId&&(!disc||x.disciplina===disc)&&x.fecha>=l&&x.fecha<=f).length;
}
// Alumnos con crédito flotante sin ubicar en la semana de `fecha`
function pendientesFlotantes(disc,fecha){
  // Sólo alumnas activas: si se da de baja a alguien con un turno flotante
  // pendiente, no tiene sentido seguir pidiendo que se le ubique esa semana.
  return state.alumnos.filter(a=>a.activo).map(a=>{
    const tiene=flotantesDe(a,disc,fecha), puestos=flotantesUbicados(a.id,disc,fecha);
    return {al:a, faltan:tiene-puestos};
  }).filter(x=>x.faltan>0);
}
function finDeCiclo(desde,al){
  const dias=diasDeClase(al), total=SEMANAS_CICLO*frecTotal(al);
  if(!dias.size||!total) return addDays(desde,SEMANAS_CICLO*7-1);
  // Con turnos flotantes no se sabe de antemano qué días vendrá,
  // así que el ciclo abarca las 4 semanas y cierra en la última clase fija.
  if(flotantesDe(al)>0){
    const limite=addDays(desde,SEMANAS_CICLO*7-1);
    let d=desde,ult=desde;
    for(let i=0;i<60;i++){ if(d>limite) break; if(dias.has(diaDe(d))) ult=d; d=addDays(d,1); }
    return ult;
  }
  let d=desde,n=0,ult=desde;
  for(let i=0;i<400;i++){
    const c=clasesEnDia(al,diaDe(d));
    if(c>0){ n+=c; ult=d; if(n>=total) break; }
    d=addDays(d,1);
  }
  return ult;
}
// Primera fecha, a partir de `desde`, en la que el alumno tiene clase
function primeraClaseDesde(desde,al){
  const dias=diasDeClase(al);
  if(!dias.size) return desde;
  let d=desde;
  for(let i=0;i<400;i++){ if(dias.has(diaDe(d))) return d; d=addDays(d,1); }
  return desde;
}
// Fecha en la que el ciclo pasa a ser exigible.
// 'vencido'   -> la primera clase DESPUÉS de terminado el ciclo (cobro al final)
// 'adelantado'-> el primer día del ciclo (cobro por adelantado)
function vencimientoDeCiclo(desde,hasta,al){
  if(state.config.momentoCobro==='adelantado') return desde;
  return primeraClaseDesde(addDays(hasta,1),al);
}
function precioDe(al){
  const ins=al.inscripciones||[];
  const p=ins.find(i=>i.disciplina==='pilates'), ind=ins.find(i=>i.disciplina==='indoor');
  if(p&&ind){
    const c=(state.config.combos||[]).find(c=>Number(c.pilates)===Number(p.frecuencia)&&Number(c.indoor)===Number(ind.frecuencia));
    if(c) return {monto:Number(c.precio)||0,detalle:`Combo Pilates ${p.frecuencia}x + Indoor ${ind.frecuencia}x`};
  }
  let t=0,ps=[];
  ins.forEach(i=>{ t+=Number((state.config.tarifas[i.disciplina]||{})[i.frecuencia])||0;
    ps.push(`${i.disciplina==='pilates'?'Pilates':'Indoor'} ${i.frecuencia}x`); });
  return {monto:t,detalle:ps.join(' + ')||'Sin inscripciones'};
}
// Reparte el precio del ciclo entre disciplinas. En los combos, el descuento
// se prorratea según lo que valdría cada disciplina por separado.
function repartoDe(al){
  const ins=al.inscripciones||[], r={pilates:0,indoor:0};
  const bruto={pilates:0,indoor:0};
  ins.forEach(i=>{ bruto[i.disciplina]+=Number((state.config.tarifas[i.disciplina]||{})[i.frecuencia])||0; });
  const sumaBruta=bruto.pilates+bruto.indoor;
  const real=precioDe(al).monto;
  if(!sumaBruta){ // sin tarifas cargadas: se reparte por cantidad de disciplinas
    const n=ins.length||1;
    ins.forEach(i=>{ r[i.disciplina]+=real/n; });
    return r;
  }
  r.pilates=Math.round(real*bruto.pilates/sumaBruta);
  r.indoor=real-r.pilates;
  return r;
}
// Cuánto de un pago corresponde a cada disciplina
function repartoPago(p){
  const c=state.cargos.find(x=>x.id===p.cargoId);
  if(!c||!c.reparto) return {pilates:Number(p.monto)||0,indoor:0};
  const base=c.reparto.pilates+c.reparto.indoor;
  if(!base) return {pilates:Number(p.monto)||0,indoor:0};
  const pil=Math.round(Number(p.monto)*c.reparto.pilates/base);
  return {pilates:pil,indoor:Number(p.monto)-pil};
}
function generarCargosPendientes(){
  let cambio=false;
  state.alumnos.filter(a=>a.activo&&(a.inscripciones||[]).length&&a.cicloDesde).forEach(al=>{
    let desde=al.cicloDesde;
    for(let g=0;g<500;g++){
      if(diff(desde,todayStr())<0) break;
      // Además del match exacto por fecha, se busca cualquier ciclo ya
      // existente que CUBRA esta fecha (desde<=desde<=hasta). Esto evita
      // crear un ciclo duplicado/superpuesto si el "ciclo desde" del alumno
      // se corrigió unos días y quedó desalineado con un cargo que ya existía.
      let c=state.cargos.find(x=>x.alumnoId===al.id&&x.tipo!=='suelta'&&x.desde<=desde&&x.hasta>=desde)
        ||state.cargos.find(x=>x.alumnoId===al.id&&x.desde===desde&&x.tipo!=='suelta');
      if(!c){ const pr=precioDe(al), hasta=finDeCiclo(desde,al);
        c={id:uid(),alumnoId:al.id,tipo:'ciclo',desde,hasta,vence:vencimientoDeCiclo(desde,hasta,al),
           monto:pr.monto,detalle:pr.detalle,reparto:repartoDe(al),pagado:false,venceV2:true};
        state.cargos.push(c); cambio=true; }
      desde=addDays(c.hasta,1);
    }
  });
  if(cambio) save('cargos');
}
function cargosImpagos(id){ return state.cargos.filter(c=>c.alumnoId===id&&!c.pagado).sort((a,b)=>a.desde.localeCompare(b.desde)); }
// Cargos que ya llegaron a su fecha de pago
function cargosVencidos(id){ return cargosImpagos(id).filter(c=>diff(c.vence,todayStr())>=0); }
function estaEnCurso(c){ return diff(c.vence,todayStr())<0; }
function diasAtraso(c,ref){ return Math.max(0,diff(c.vence,ref||todayStr())); }
function escalonDe(d){ const ts=[...(state.config.recargos||[])].sort((a,b)=>a.desde-b.desde); let s=null; ts.forEach(t=>{if(d>=Number(t.desde)) s=t;}); return s; }
function recargoDe(c,ref){
  const d=diasAtraso(c,ref);
  if(d<=Number(state.config.diasGracia||0)) return 0;
  const t=escalonDe(d); if(!t) return 0;
  return t.tipo==='porcentaje'?Math.round(c.monto*(Number(t.valor)||0)/100):(Number(t.valor)||0);
}
// Sólo lo que ya es exigible. Un ciclo en curso todavía no es deuda.
function deudaTotal(id){ return cargosVencidos(id).reduce((s,c)=>s+c.monto+recargoDe(c),0); }
function estadoDe(al){
  const imp=cargosImpagos(al.id);
  if(!imp.length) return {k:'ok',txt:'Al día'};
  const venc=cargosVencidos(al.id);
  if(!venc.length){
    const prox=imp[0];
    return {k:'gris',txt:`Paga el ${fmtCorto(prox.vence)}`};
  }
  if(venc.length>1) return {k:'deuda',txt:`Debe ${venc.length} ciclos`};
  const d=diasAtraso(venc[0]);
  if(d>Number(state.config.diasGracia||0)) return {k:'deuda',txt:`${d} días de atraso`};
  return {k:'warn',txt:'A pagar'};
}
// Versión de horarios vigente en una fecha dada
function versionEn(al,fecha){
  const h=al.historial||[];
  for(const v of h){ if(fecha>=v.desde&&(!v.hasta||fecha<=v.hasta)) return v; }
  return null;
}
function inscripcionesEn(al,fecha){
  const v=versionEn(al,fecha);
  return v?(v.inscripciones||[]):[];
}
// Cambio puntual: viene otro día/horario sólo esa vez, sin cobro ni ausencia
function cambioOrigen(alId,disc,fecha,hora){
  return state.cambios.find(x=>x.alumnoId===alId&&x.disciplina===disc&&
    x.fechaOrigen===fecha&&x.horaOrigen===hora);
}
function ocupantes(disc,fecha,horario){
  const dia=diaDe(fecha), out=[];
  // se usa el horario que regía esa fecha, no el actual
  state.alumnos.forEach(al=>{
    // Una alumna dada de baja no debe seguir ocupando su lugar, aunque su
    // inscripción vigente no se haya cerrado formalmente (vigente_hasta).
    if(!al.activo) return;
    inscripcionesEn(al,fecha).forEach(i=>{ if(i.disciplina!==disc) return;
      (i.slots||[]).forEach(s=>{
        if(s.tipo==='flotante'||s.dia!==dia||s.horario!==horario) return;
        const mov=cambioOrigen(al.id,disc,fecha,horario);
        out.push(mov?{al,tipo:'movido-origen',refId:mov.id,
          destino:`${fmtCorto(mov.fechaDestino)} ${mov.horaDestino}`}:{al,tipo:'fijo'});
      }); });
  });
  state.cambios.filter(x=>x.disciplina===disc&&x.fechaDestino===fecha&&x.horaDestino===horario).forEach(x=>{
    const al=state.alumnos.find(a=>a.id===x.alumnoId);
    if(al&&al.activo) out.push({al,tipo:'movido',refId:x.id,origen:`${fmtCorto(x.fechaOrigen)} ${x.horaOrigen}`});
  });
  state.flotantes.filter(f=>f.disciplina===disc&&f.fecha===fecha&&f.horario===horario).forEach(f=>{
    const al=state.alumnos.find(a=>a.id===f.alumnoId);
    if(al&&al.activo) out.push({al,tipo:'flotante',refId:f.id});
  });
  state.unicos.filter(u=>u.disciplina===disc&&u.fecha===fecha&&u.horario===horario).forEach(u=>{
    const al=state.alumnos.find(a=>a.id===u.alumnoId);
    if(al&&al.activo) out.push({al,tipo:'unico',refId:u.id});
  });
  return out;
}
function asistDe(id,disc,fecha,hora){
  const a=state.asistencias.find(x=>x.alumnoId===id&&x.disciplina===disc&&x.fecha===fecha&&x.horario===hora);
  return a?a.estado:null;
}
function ocupacion(disc,fecha,hora){
  const oc=ocupantes(disc,fecha,hora);
  // no ocupan lugar: los ausentes y los movidos a otro horario
  const aus=oc.filter(o=>o.tipo==='movido-origen'||asistDe(o.al.id,disc,fecha,hora)==='ausente').length;
  return {total:oc.length,efectivos:oc.length-aus,cupo:state.config.cupos[disc],lista:oc};
}

/* ═════════ RENDER RAÍZ ═════════ */
function render(){
  const root=document.getElementById('root');
  if(recuperando){ root.innerHTML=vRecuperar(); return; }
  if(!sesion){ root.innerHTML=mfaPending?vMfaVerify():(hayDueno?vLogin():vSetup()); return; }
  const u=usuarioActual();
  if(!u||!u.activo){ sesion=null; root.innerHTML=vLogin(); return; }

  const posibles=[
    ['inicio','Inicio',null],
    ['agenda','Agenda','agenda_ver'],
    ['alumnos','Alumnos','alumnos_ver'],
    ['pagos','Pagos','pagos_ver'],
    ['finanzas','Finanzas','finanzas'],
    ['equipo','Equipo','usuarios'],
    ['config','Ajustes','ajustes']
  ].filter(([,,p])=>!p||puede(p));
  if(!posibles.some(([k])=>k===tab)) tab=posibles[0][0];

  root.innerHTML=`
  <div id="app">
    <header class="top">
      <div><h1>Estudio</h1><p>Pilates &amp; Indoor</p></div>
      <div class="whoami">
        <div class="nm">${esc(u.nombre)}</div>
        <div class="rl">${u.rol}</div>
        <button class="mini-btn" style="margin-top:5px;" onclick="cerrarSesion()">Salir</button>
      </div>
    </header>
    <nav class="tabs">${posibles.map(([k,l])=>
      `<button class="${tab===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav>
    <main id="view"></main>
  </div>`;
  pintarVista();
}
function pintarVista(){
  const v=document.getElementById('view'); if(!v) return;
  v.innerHTML = tab==='inicio'?vInicio(): tab==='agenda'?vAgenda(): tab==='alumnos'?vAlumnos():
                tab==='pagos'?vPagos(): tab==='finanzas'?vFinanzas(): tab==='equipo'?vEquipo(): vConfig();
}
function go(k){ tab=k; agAbierto=null; render(); window.scrollTo(0,0); }
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2900); }
function cerrar(){ document.getElementById('modalRoot').innerHTML=''; }

    <label>Contraseña</label><input id="s_p1" type="password" autocomplete="new-password">
    <label>Repetir contraseña</label><input id="s_p2" type="password" autocomplete="new-password">
    <div class="note" style="margin-top:12px;">Mínimo 8 caracteres, con letras y números.</div>
    <button class="btn block" style="margin-top:16px;" onclick="crearDueno()">Crear cuenta</button>
    <div class="note aviso" style="margin-top:18px;">
      <b>Importante:</b> los datos se guardan en la nube (Supabase), no en este dispositivo:
      podés entrar desde el celular y la computadora con la misma cuenta. Guardá bien la

async function crearDueno(){
  if(bloqueado('crear-usuario')) return;
  try{
    const nom=document.getElementById('s_nom').value.trim();
    const mail=document.getElementById('s_mail').value.trim().toLowerCase();
    const p1=document.getElementById('s_p1').value, p2=document.getElementById('s_p2').value;
    if(!nom) return showToast('Falta el nombre.');
    if(!emailOk(mail)) return showToast('Email inválido.');
    const err=validarPass(p1); if(err) return showToast(err);
    if(p1!==p2) return showToast('Las contraseñas no coinciden.');
    const {data,error}=await sb.functions.invoke('crear-usuario',{body:{accion:'crear',nombre:nom,email:mail,password:p1,rol:'dueño'}});
    if(error) return showToast('Error de conexión. Probá de nuevo.');
    if(data&&data.error) return showToast(data.error);
    const {error:errLogin}=await sb.auth.signInWithPassword({email:mail,password:p1});
    if(errLogin) return showToast('Cuenta creada, pero no se pudo iniciar sesión. Probá entrar de nuevo.');
    await cargarSesionYDatos();
    generarCargosPendientes();
    render(); showToast('Cuenta creada. ¡Bienvenida!');
  } finally { desbloquear('crear-usuario'); }
}

function modalOlvidoPass(){

    <h2 style="margin-bottom:8px;">Recuperar contraseña</h2>

async function enviarRecuperacion(){
  if(bloqueado('rec-pass')) return;
  try{
    const mail=document.getElementById('rec_mail').value.trim().toLowerCase();
    const err=document.getElementById('rec_mail_err');
    if(!emailOk(mail)){ err.textContent='Email inválido.'; return; }
    // No confirmamos si el mail existe o no en la respuesta: evita que alguien
    // use este formulario para averiguar qué cuentas están registradas.
    await sb.auth.resetPasswordForEmail(mail,{redirectTo:window.location.origin+window.location.pathname});
    cerrar(); showToast('Si ese email está registrado, te va a llegar un mail con el link.');
  } finally { desbloquear('rec-pass'); }
}
function vRecuperar(){
  return `<div class="auth-wrap">
    <h1>Elegí tu nueva contraseña</h1>
    <div class="sub">Este link es válido una sola vez.</div>
    <label>Contraseña nueva</label><input id="rec_p1" type="password" autocomplete="new-password">
    <label>Repetila</label><input id="rec_p2" type="password" autocomplete="new-password">
    <div class="note" style="margin-top:12px;">Mínimo 8 caracteres, con letras y números.</div>
    <button class="btn block" style="margin-top:16px;" onclick="confirmarNuevaPass()">Guardar contraseña</button>
    <div id="rec_err" style="color:var(--danger);font-size:13px;margin-top:12px;text-align:center;"></div>
  </div>`;
}
async function confirmarNuevaPass(){
  if(bloqueado('rec-pass2')) return;
  try{
    const p1=document.getElementById('rec_p1').value, p2=document.getElementById('rec_p2').value;
    const err=document.getElementById('rec_err');
    const ve=validarPass(p1); if(ve){ err.textContent=ve; return; }
    if(p1!==p2){ err.textContent='Las contraseñas no coinciden.'; return; }
    const {error}=await sb.auth.updateUser({password:p1});
    if(error){ err.textContent='No se pudo actualizar: '+error.message; return; }
    recuperando=false;
    await cargarSesionYDatos();
    if(!sesion){ render(); return; }
    generarCargosPendientes();
    tab='inicio'; render(); showToast('Contraseña actualizada. ¡Bienvenida!');
  } finally { desbloquear('rec-pass2'); }
}
function fmtHora(iso){ try{ return new Date(iso).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
async function entrar(){
  // Protección contra doble envío: un doble clic o Enter+clic no debe contar
  // como dos intentos (así no se gasta el contador de bloqueo de más).
  if(bloqueado('login')) return;
  try{
  const mail=document.getElementById('l_mail').value.trim().toLowerCase();
  const pass=document.getElementById('l_pass').value;
  const err=document.getElementById('l_err');
  err.textContent='';
  if(!mail||!pass) return;
  // Antes de intentar, chequeamos si la cuenta está bloqueada por intentos previos.
  try{
    const {data:chk}=await sb.rpc('puede_intentar_login',{p_email:mail});
    if(chk&&chk.bloqueado){ err.textContent=`Demasiados intentos. Esperá hasta las ${fmtHora(chk.hasta)} y probá de nuevo.`; return; }
  }catch(e){ /* si el chequeo falla, no bloqueamos el login por eso */ }
  const {error:errLogin}=await sb.auth.signInWithPassword({email:mail,password:pass});
  if(errLogin){
    try{
      const {data:r}=await sb.rpc('registrar_intento_fallido',{p_email:mail});
      if(r&&r.bloqueado){ err.textContent='Demasiados intentos fallidos. La cuenta queda bloqueada 15 minutos.'; return; }
    }catch(e){}
    err.textContent='Email o contraseña incorrectos.';
    return;
  }
  try{ await sb.rpc('registrar_intento_exitoso'); }catch(e){}
  if(!(await resolverMFA())) return; // quedó mostrando la pantalla del código de verificación
  await cargarSesionYDatos();
  if(!sesion){ err.textContent='Tu usuario está desactivado. Hablá con la dueña.'; return; }
  generarCargosPendientes();
  tab='inicio'; render(); showToast(`Hola, ${usuarioActual().nombre.split(' ')[0]}`);
  } finally { desbloquear('login'); }
}
// Si la cuenta que acaba de loguearse (a nivel Supabase Auth) tiene un factor
// TOTP ya verificado, exige el código de 6 dígitos antes de dar acceso a la app.
// Devuelve true si puede seguir de una, o false si quedó esperando el código.
async function resolverMFA(){
  const {data}=await sb.auth.mfa.listFactors();
  const factor=(data&&data.totp||[]).find(f=>f.status==='verified');
  if(!factor) return true;
  const {data:ch,error:e1}=await sb.auth.mfa.challenge({factorId:factor.id});
  if(e1){ showToast('No se pudo iniciar la verificación en dos pasos. Probá de nuevo.'); await sb.auth.signOut(); return false; }
  mfaPending={factorId:factor.id,challengeId:ch.id};
  render();
  return false;
}
function vMfaVerify(){
  return `<div class="auth-wrap">
    <h1>Verificación en dos pasos</h1>
    <div class="sub">Ingresá el código de 6 dígitos de tu app de autenticación (Google Authenticator, Authy, etc).</div>
    <label>Código</label><input id="mfa_code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
      onkeydown="if(event.key==='Enter')confirmarMFA()">
    <button class="btn block" style="margin-top:18px;" onclick="confirmarMFA()">Confirmar</button>
    <button class="btn ghost block" style="margin-top:9px;" onclick="cancelarMFA()">Cancelar e iniciar sesión de nuevo</button>
    <div id="mfa_err" style="color:var(--danger);font-size:13px;margin-top:12px;text-align:center;"></div>
  </div>`;
}
async function confirmarMFA(){
  const code=document.getElementById('mfa_code').value.trim();
  const err=document.getElementById('mfa_err');
  const {error}=await sb.auth.mfa.verify({factorId:mfaPending.factorId,challengeId:mfaPending.challengeId,code});
  if(error){ err.textContent='Código incorrecto. Probá de nuevo.'; return; }
  mfaPending=null;
  await cargarSesionYDatos();
  if(!sesion){ render(); return; }
  generarCargosPendientes();
  tab='inicio'; render(); showToast(`Hola, ${usuarioActual().nombre.split(' ')[0]}`);
}
async function cancelarMFA(){
  mfaPending=null;
  await sb.auth.signOut();
  render();
}

/* ═════════ INICIO ═════════ */
function vInicio(){
  const act=state.alumnos.filter(a=>a.activo);
  let h='';
  const cards=[];
  cards.push(`<div class="stat"><div class="num">${act.length}</div><div class="label">Alumnos activos</div></div>`);
  let clasesHoy=0;
  if(diaDe(todayStr())!=='Domingo') ['pilates','indoor'].forEach(d=>
    state.config.horarios.forEach(x=>{ if(ocupacion(d,todayStr(),x).total) clasesHoy++; }));
  cards.push(`<div class="stat"><div class="num">${clasesHoy}</div><div class="label">Clases hoy</div></div>`);
  if(puede('pagos_ver')){
    const porCobrar=act.reduce((s,a)=>s+deudaTotal(a.id),0);
    cards.push(`<div class="stat"><div class="num mono" style="color:var(--danger)">${money(porCobrar)}</div><div class="label">Por cobrar</div></div>`);
  }
  if(puede('finanzas')){
    const mes=todayStr().slice(0,7);
    const ing=state.pagos.filter(p=>p.fecha.slice(0,7)===mes).reduce((s,p)=>s+Number(p.monto),0);
    const gas=state.gastos.filter(g=>g.fecha.slice(0,7)===mes).reduce((s,g)=>s+Number(g.monto),0);
    cards.push(`<div class="stat"><div class="num mono" style="color:${ing-gas>=0?'var(--fijo-ink)':'var(--danger)'}">${money(ing-gas)}</div><div class="label">Resultado del mes</div></div>`);
  }
  h+=`<div class="grid-stats">${cards.join('')}</div>`;
  const cumples=act.filter(esCumpleHoy);
  if(cumples.length){
    h+=`<div class="note aviso" style="margin-bottom:13px;">
      ${cumples.map(a=>`🎂 <b>${esc(a.nombre)}</b> cumple años hoy (${edadCumple(a)}).`).join('<br>')}
    </div>`;
  }
  if(puede('ajustes')&&hayDatos()){
    const dSin=diasSinBackup();
    if(dSin===null) h+=`<div class="note aviso" style="margin-bottom:13px;">
      <b>Todavía no hay copia de seguridad.</b> Si se borran los datos del navegador se pierde todo.
      <button class="btn sm" style="margin-top:8px;" onclick="go('config')">Hacer copia ahora</button></div>`;
    else if(dSin>14) h+=`<div class="note aviso" style="margin-bottom:13px;">
      Última copia hace <b>${dSin} días</b>.
      <button class="btn sm" style="margin-top:8px;" onclick="go('config')">Hacer una nueva</button></div>`;
  }

  if(puede('pagos_ver')){
    const cd=act.filter(a=>cargosVencidos(a.id).length);
    if(cd.length){
      h+=`<h3 style="margin-bottom:8px;">Cobranzas pendientes</h3><div class="card">`;
      cd.sort((a,b)=>deudaTotal(b.id)-deudaTotal(a.id)).slice(0,12).forEach(a=>{
        const e=estadoDe(a);
        h+=`<div class="list-item" onclick="${puede('pagos_editar')?`modalPago('${a.id}')`:''}">
          <div style="min-width:0;"><div class="name">${esc(a.nombre)}</div>
          <div class="meta">${cargosVencidos(a.id).length} ciclo(s) sin pagar</div></div>
          <div style="text-align:right;flex:0 0 auto;">
            <div class="mono" style="font-weight:700;font-size:14px;">${money(deudaTotal(a.id))}</div>
            <span class="badge ${e.k}" style="margin-top:3px;">${e.txt}</span></div></div>`;
      });
      h+=`</div>`;
    } else if(act.length) h+=`<div class="empty"><div class="glyph">✓</div>No hay deudas pendientes.</div>`;
  }
  if(!act.length) h+=`<div class="empty"><div class="glyph">○</div>Todavía no hay alumnos cargados.</div>`;

  h+=`<h3 style="margin:18px 0 8px;">Seguridad de tu cuenta</h3><div class="card">
    <div class="list-item" style="cursor:default;">
      <div style="min-width:0;"><div class="name">Verificación en dos pasos</div>
      <div class="meta">${miMfaFactor?'Activada: te va a pedir un código además de la contraseña.':'Desactivada: solo pide contraseña.'}</div></div>
      ${miMfaFactor
        ?`<button class="btn ghost sm" onclick="desactivarMFA()">Desactivar</button>`
        :`<button class="btn sm" onclick="activarMFA()">Activar</button>`}
    </div>
    <div class="list-item" style="cursor:pointer;" onclick="modalPrivacidad()">
      <div class="name">Política de privacidad</div><span class="mini-btn">Ver</span>
    </div>
  </div>`;
  return h;
}

/* ═════════ AGENDA ═════════ */
function vAgenda(){
  const puedeEditar=puede('agenda_editar');
  const cupo=state.config.cupos[agDisc];
  let h=`<div class="seg">
    <button class="${agDisc==='pilates'?'active':''}" onclick="setDisc('pilates')">Pilates · ${state.config.cupos.pilates} camillas</button>
    <button class="${agDisc==='indoor'?'active':''}" onclick="setDisc('indoor')">Indoor · ${state.config.cupos.indoor} bicis</button>
  </div>`;
  const lunes=lunesDe(agFecha);
  h+=`<div class="week-bar">
    <button class="mini-btn" onclick="moverSemana(-1)">←</button>
    <span class="lbl">${fmtCorto(lunes)} – ${fmtCorto(addDays(lunes,5))}</span>
    <button class="mini-btn" onclick="moverSemana(1)">→</button>
  </div>
  ${lunes!==lunesDe(diaHabil(todayStr()))?`<div style="text-align:center;margin-bottom:8px;">
    <button class="mini-btn" onclick="irHoy()">Volver a la semana actual</button></div>`:''}
  <div class="day-strip">`;
  for(let i=0;i<6;i++){ const f=addDays(lunes,i);
    h+=`<div class="day-chip ${f===agFecha?'active':''}" onclick="setFecha('${f}')">
      <div class="dn">${DIAS_CORTO[i]}</div><div class="dd">${fmtCorto(f)}</div></div>`; }
  h+=`</div>`;
  if(diaDe(agFecha)==='Domingo') return h+`<div class="empty">Domingo — sin actividad.</div>`;
  const pend=pendientesFlotantes(agDisc,agFecha);
  if(pend.length&&puedeEditar){
    h+=`<div class="note aviso" style="margin:12px 0 8px;">
      <b>Faltan ubicar esta semana:</b><br>${pend.map(x=>
        `${esc(x.al.nombre)}${x.faltan>1?` (${x.faltan})`:''}`).join(' · ')}</div>`;
  }
  h+=`<div style="font-size:12px;color:var(--ink-faint);margin:12px 0 8px;">Tocá un horario para ver quiénes están anotados.</div>`;

  state.config.horarios.forEach(hora=>{
    const o=ocupacion(agDisc,agFecha,hora);
    const lleno=o.efectivos>=cupo;
    const nombres=o.lista.filter(x=>asistDe(x.al.id,agDisc,agFecha,hora)!=='ausente')
      .map(x=>x.al.nombre.split(' ')[0]).join(', ');
    h+=`<div class="slot-card"><div class="slot-head" onclick="toggleSlot('${hora}')">
      <span class="hora">${hora}</span>
      <span class="prev">${esc(nombres)||'libre'}</span>
      <span class="cupo ${lleno?'lleno':'libre'}">${o.efectivos}/${cupo}</span></div>`;
    if(agAbierto===hora){
      h+=`<div class="slot-body">`;
      if(!o.lista.length) h+=`<div style="font-size:13px;color:var(--ink-faint);padding:6px 0;">Nadie anotado.</div>`;
      o.lista.forEach(x=>{
        const est=asistDe(x.al.id,agDisc,agFecha,hora);
        if(x.tipo==='movido-origen'){
          h+=`<div class="ocup movida">
            <span class="badge movido">Movida</span>
            <span class="nm">${esc(x.al.nombre)} <small style="color:var(--ink-faint);">→ ${esc(x.destino)}</small></span>
            ${puedeEditar?`<button class="mini-btn" onclick="deshacerCambio('${x.refId}')">Deshacer</button>`:''}
          </div>`;
          return;
        }
        h+=`<div class="ocup ${est==='ausente'?'falto':''}">
          <span class="badge ${x.tipo==='movido'?'movido':x.tipo}">${
            x.tipo==='fijo'?'Fija':x.tipo==='flotante'?'Flot':x.tipo==='movido'?'Movida':'Suelta'}</span>
          <span class="nm">${esc(x.al.nombre)}${x.tipo==='movido'?` <small style="color:var(--ink-faint);">viene de ${esc(x.origen)}</small>`:''}</span>
          ${puedeEditar?`
          <button class="mini-btn ${est==='presente'?'on-p':''}" onclick="marcar('${x.al.id}','${hora}','presente')">Vino</button>
          <button class="mini-btn ${est==='ausente'?'on-a':''}" onclick="marcar('${x.al.id}','${hora}','ausente')">Faltó</button>
          ${x.tipo==='fijo'?`<button class="mini-btn" onclick="modalMover('${x.al.id}','${hora}')">Mover</button>`:''}
          ${x.tipo==='movido'?`<button class="mini-btn" onclick="deshacerCambio('${x.refId}')">✕</button>`:''}
          ${(x.tipo==='flotante'||x.tipo==='unico')?`<button class="mini-btn" onclick="quitarUbicacion('${x.tipo}','${x.refId}')">✕</button>`:''}`
          :`<span class="badge gris">${est==='presente'?'Vino':est==='ausente'?'Faltó':'—'}</span>`}
        </div>`;
      });
      if(puedeEditar) h+=`<div style="margin-top:10px;">${lleno
        ?`<div class="note">Sin lugar. Si alguien avisa que no viene, marcalo <b>Faltó</b> y se libera el lugar sólo por hoy.</div>`
        :`<button class="btn secondary sm" onclick="modalAgregar('${hora}')">+ Anotar a alguien · ${cupo-o.efectivos} libre${cupo-o.efectivos>1?'s':''}</button>`}</div>`;
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  return h;
}
function setDisc(d){ agDisc=d; agAbierto=null; pintarVista(); }
function setFecha(f){ agFecha=diaHabil(f); agAbierto=null; pintarVista(); }
function moverSemana(n){ agFecha=diaHabil(addDays(agFecha,n*7)); agAbierto=null; pintarVista(); }
function irHoy(){ agFecha=diaHabil(todayStr()); agAbierto=null; pintarVista(); }
function toggleSlot(h){ agAbierto=agAbierto===h?null:h; pintarVista(); }
function marcar(id,hora,estado){
  if(!puede('agenda_editar')) return;
  const i=state.asistencias.findIndex(x=>x.alumnoId===id&&x.disciplina===agDisc&&x.fecha===agFecha&&x.horario===hora);
  if(i>=0){ if(state.asistencias[i].estado===estado) state.asistencias.splice(i,1); else state.asistencias[i].estado=estado; }
  else state.asistencias.push({id:uid(),alumnoId:id,disciplina:agDisc,fecha:agFecha,horario:hora,estado});
  // Las asistencias se escriben en el acto, sin esperar la ventana de 450 ms:
  // se cargan de a muchas y seguidas, y cualquier recarga de la página en el
  // medio se llevaba puesto lo que todavía no había salido.
  save('asistencias'); guardarYa(); pintarVista();
}

  const al=state.alumnos.find(a=>a.id===alId);
  window._mov={alId,hora,fechaOrigen:agFecha,fechaDestino:agFecha};
  document.getElementById('modalRoot').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)cerrar()"><div class="modal">
    <h2 style="margin-bottom:6px;">Mover a ${esc(al.nombre)}</h2>
    <div class="note" style="margin-bottom:12px;">Viene de <b>${diaDe(agFecha)} ${fmt(agFecha)} · ${hora}</b>.
      El cambio vale <b>sólo por esta vez</b>: no se le cobra nada, no queda como ausente,
      y su turno fijo sigue igual las próximas semanas.</div>
    <label style="margin-top:0;">¿Qué día viene?</label>
    <input type="date" id="mv_fecha" value="${agFecha}" onchange="pintarDestinos()">
    <label>¿A qué horario?</label>
    <div id="mv_horarios"></div>

function confirmarMover(horaDestino){
  if(bloqueado('confirmar-mover')) return;
  try{
    const m=window._mov;
    const yo=usuarioActual();
    // Un mismo turno (alumno+disciplina+fecha/hora de origen) sólo puede tener
    // un cambio vigente: si ya existe (por ej. por un doble toque), se actualiza
    // en vez de crear una fila nueva con el mismo dato de negocio (rompería el
    // guardado, ver onConflict de 'cambios').
    const i=state.cambios.findIndex(x=>x.alumnoId===m.alId&&x.disciplina===agDisc&&x.fechaOrigen===m.fechaOrigen&&x.horaOrigen===m.hora);
    const fila={id:i>=0?state.cambios[i].id:uid(),alumnoId:m.alId,disciplina:agDisc,
      fechaOrigen:m.fechaOrigen,horaOrigen:m.hora,
      fechaDestino:m.fechaDestino,horaDestino:horaDestino,
      creadoPor:yo?yo.nombre:''};
    if(i>=0) state.cambios[i]=fila; else state.cambios.push(fila);
    save('cambios'); cerrar();
    agFecha=m.fechaDestino; agAbierto=horaDestino;
    pintarVista(); showToast('Movida por esta vez.');
  } finally { desbloquear('confirmar-mover'); }
}

function ubicarFlotante(alId,hora){
  if(bloqueado('ubicar-flotante')) return;
  try{
    // Evita duplicar la fila si el botón se toca dos veces (no hay restricción
    // de unicidad en la base para esta tabla, así que un duplicado no fallaría
    // con error: quedaría contando de más en el cupo, en silencio).
    const ya=state.flotantes.some(f=>f.alumnoId===alId&&f.disciplina===agDisc&&f.fecha===agFecha&&f.horario===hora);
    if(!ya) state.flotantes.push({id:uid(),alumnoId:alId,disciplina:agDisc,fecha:agFecha,horario:hora});
    save('flotantes'); cerrar(); pintarVista(); showToast('Turno flotante ubicado.');
  } finally { desbloquear('ubicar-flotante'); }
}
// Cargo puntual por una clase suelta, exigible el mismo día
function cargoSuelta(alId){
  const monto=Number((state.config.tarifaSuelta||{})[agDisc])||0;
  if(!monto) return;
  const rep={pilates:0,indoor:0}; rep[agDisc]=monto;
  state.cargos.push({id:uid(),alumnoId:alId,tipo:'suelta',desde:agFecha,hasta:agFecha,
    vence:agFecha,monto,detalle:`Clase suelta ${agDisc==='pilates'?'Pilates':'Indoor'} ${fmt(agFecha)}`,
    reparto:rep,pagado:false,venceV2:true});
  save('cargos');
}

/* Refleja en pantalla la misma versión que se acaba de escribir en la base,
   para que el alumno aparezca en la agenda sin tener que recargar. */
function aplicarVersionLocal(al,nuevas,desde){
  al.historial=al.historial||[];
  const copia=JSON.parse(JSON.stringify(nuevas||[]));
  const actual=al.historial.find(v=>!v.hasta);
  if(actual){
    if(actual.desde>=desde){ actual.desde=desde; actual.inscripciones=copia; }
    else { actual.hasta=addDays(desde,-1); al.historial.push({desde,hasta:null,inscripciones:copia}); }
  } else al.historial.push({desde,hasta:null,inscripciones:copia});
  al.historial.sort((x,y)=>x.desde.localeCompare(y.desde));
  al.inscripciones=copia;
}
function cerrarVersionLocal(al,hasta){
  const v=(al.historial||[]).find(x=>!x.hasta);
  if(v) v.hasta=hasta;
}

function firmaTurnos(ins){
  return JSON.stringify((ins||[]).map(i=>({d:i.disciplina,f:Number(i.frecuencia),
    s:(i.slots||[]).map(s=>`${s.tipo}|${s.dia||''}|${s.horario||''}`).sort()}))
    .sort((a,b)=>a.d.localeCompare(b.d)));
}

    const elVig=document.getElementById('f_vigDesde');

      if(s.tipo==='flotante') continue;
      const cupo=state.config.cupos[i.disciplina];
      const fRef=addDays(lunes,DIAS.indexOf(s.dia));
      const oc=ocupantes(i.disciplina,fRef,s.horario).filter(o=>o.al.id!==id);
      // Un turno fijo se ocupa TODAS las semanas, así que lo único que lo puede
      // llenar de verdad son los otros turnos fijos (incluidas las que ese día
      // están movidas a otro horario: el lugar lo siguen teniendo). Las que
      // están por única vez —movidas desde otro turno, flotantes ubicados,
      // clases sueltas— ocupan sólo esa fecha, así que no pueden impedir una
      // asignación permanente: se avisa, pero no se bloquea.
      const fijos=oc.filter(o=>o.tipo==='fijo'||o.tipo==='movido-origen');
      const disc=i.disciplina==='pilates'?'Pilates':'Indoor';
      if(fijos.length>=cupo) return errorForm(`${disc} ${s.dia} ${s.horario} ya está completo (${cupo}/${cupo}). Elegí otro horario.`);
      if(oc.length>=cupo) avisos.push(`${s.dia} ${s.horario}: esa fecha hay ${oc.length-fijos.length} por única vez, quedan ${oc.length+1} en la clase`);
    }
    const consentFirmado=document.getElementById('f_consent').checked;
    const data={nombre:nom,dni:document.getElementById('f_dni').value.trim(),
      telefono:document.getElementById('f_tel').value.trim(),
      patologia:document.getElementById('f_pat').value.trim(),
      fechaNacimiento:document.getElementById('f_nac').value||null,
      inscripciones:window._ins,
      consentimientoFirmado:consentFirmado,
      consentimientoFecha:consentFirmado?(document.getElementById('f_consentFecha').value||todayStr()):null,
      cicloDesde:window._ins.length?document.getElementById('f_ciclo').value:null,activo:true};
    let alumnoId=id, cambioTurnos=true, desdeRige=todayStr();
    if(id){
      const ix=state.alumnos.findIndex(a=>a.id===id);
      const prev=state.alumnos[ix];
      cambioTurnos=firmaTurnos(prev.inscripciones)!==firmaTurnos(window._ins);
      const elv=document.getElementById('f_vigDesde');
      desdeRige=(elv&&elv.value)||todayStr();
      state.alumnos[ix]={...prev,...data,fechaBaja:null};
    } else {
      alumnoId=uid();
      desdeRige=data.cicloDesde||todayStr();
      state.alumnos.push({id:alumnoId,...data,fechaAlta:todayStr()});
    }
    await save('alumnos');
    if(cambioTurnos){
      try{
        await sincronizarInscripciones(alumnoId,window._ins,desdeRige);
        aplicarVersionLocal(state.alumnos.find(a=>a.id===alumnoId),window._ins,desdeRige);
      }
      catch(e){ errorForm('No se pudieron guardar los turnos: '+((e&&e.message)||e)+
        ' — los datos personales sí se guardaron y los turnos quedaron como estaban.'); return; }
    }
    generarCargosPendientes();
    // Se limpian los filtros para que el alumno recién guardado sea visible
    busqueda=''; verInactivos=false;
    cerrar(); pintarVista();
    showToast(avisos.length?`${nom} guardado. Ojo — ${avisos[0]}.`:`${nom} guardado.`);
  } finally { desbloquear('alumno'); }
}

  state.alumnos[ix].cicloDesde=todayStr();

// Borrado DEFINITIVO: a diferencia de "Dar de baja", esto no deja rastro.
// Se borra la ficha y, en cascada en la base, sus inscripciones, asistencias,
// cambios, turnos flotantes, pagos y cargos. Sólo lo puede hacer la dueña
// (verificado también en el servidor, en la función eliminar_alumno).
function eliminarAlumno(id){
  if(!esDueño()) return;
  const a=state.alumnos.find(x=>x.id===id);
  if(!a) return;
  // Antes pedía escribir el nombre completo, pero eso queda trabado (sin avisar
  // por qué) apenas hay una tilde, mayúscula o espacio de diferencia con lo que
  // está guardado. Pedir una palabra fija es igual de deliberado y no falla así.
  document.getElementById('modalRoot').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)cerrar()"><div class="modal">
    <h2 style="margin-bottom:10px;">Eliminar a ${esc(a.nombre)}</h2>
    <div class="note" style="color:var(--danger);"><b>Esta acción no se puede deshacer.</b> Se borran para
      siempre la ficha, los turnos, las asistencias, los cambios, los turnos flotantes y <b>todos los pagos
      y cargos</b> de ${esc(a.nombre)}. Si en cambio querés conservar su historial, usá "Dar de baja".</div>
    <label style="margin-top:14px;">Para confirmar, escribí ELIMINAR</label>
    <input id="del_confirm" placeholder="ELIMINAR" autocomplete="off"
      oninput="document.getElementById('del_btn').disabled=(this.value.trim().toUpperCase()!=='ELIMINAR')">
    <button id="del_btn" class="btn danger block" style="margin-top:16px;" disabled onclick="confirmarEliminarAlumno('${id}')">Eliminar definitivamente</button>
    <button class="btn ghost block" style="margin-top:9px;" onclick="cerrar()">Cancelar</button>
  </div></div>`;
}
async function confirmarEliminarAlumno(id){
  if(!esDueño()) return;
  if(bloqueado('eliminar-alumno')) return;
  try{
    const a=state.alumnos.find(x=>x.id===id);
    if(!a) return;
    const {error}=await sb.rpc('eliminar_alumno',{p_alumno_id:id});
    if(error) return showToast('No se pudo eliminar: '+error.message);
    // Se limpia el estado local (y lo que sincronizarTabla recuerda de cada
    // tabla) para que el borrado, ya hecho en la base, no intente "recrearse"
    // en el próximo guardado.
    ['unicos','flotantes','cambios','asistencias','cargos','pagos'].forEach(k=>{
      const idsBorrados=state[k].filter(x=>x.alumnoId===id).map(x=>x.id);
      state[k]=state[k].filter(x=>x.alumnoId!==id);
      idsBorrados.forEach(rowId=>{
        if(_idsConocidos[k]) _idsConocidos[k].delete(rowId);
        if(_snapConocidos[k]) delete _snapConocidos[k][rowId];
      });
    });
    state.alumnos=state.alumnos.filter(x=>x.id!==id);
    if(_idsConocidos.alumnos) _idsConocidos.alumnos.delete(id);
    if(_snapConocidos.alumnos) delete _snapConocidos.alumnos[id];
    cerrar(); pintarVista();
    showToast(`${a.nombre} fue eliminado definitivamente.`);
  } finally { desbloquear('eliminar-alumno'); }
}

function confirmarPago(cargoId){
  if(bloqueado('pago')) return;
  try{
    const c=state.cargos.find(x=>x.id===cargoId);
    if(c.pagado) return showToast('Ese ciclo ya está pagado.');
    const monto=Number(document.getElementById('p_monto').value)||0;
    const fecha=document.getElementById('p_fecha').value;

      registradoPor:usuarioActual().nombre});

    save('cargos'); save('pagos'); cerrar(); pintarVista(); showToast('Pago registrado.');
  } finally { desbloquear('pago'); }
